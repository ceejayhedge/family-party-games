<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<title>Family Party Games 家庭派对游戏</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;background:#fff7ec;color:#222}
#hub{height:100%;overflow:auto;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff3e0 0%,#fff7ec 40%,#ffe8cc 100%)}
#hub[hidden]{display:none !important}
.hub-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:#ff8a3d;color:#fff}
.hub-top h1{font-size:24px;margin:0 8px 0 0;line-height:1.3}
button,select{font-size:17px;padding:9px 12px;border-radius:10px;border:2px solid #ccc;cursor:pointer;background:#fff;color:#222;font-family:inherit}
button.big{background:#2b7a0b;color:#fff;font-weight:700;border-color:#2b7a0b}
button.warn{background:#c62828;color:#fff;border-color:#c62828;font-weight:700}
label.dd{display:flex;align-items:center;gap:6px;font-weight:700}
.score{font-size:18px;font-weight:700;background:#fff;color:#222;padding:6px 10px;border-radius:10px}
.score button{padding:2px 10px;margin-left:4px}
.hub-hero{text-align:center;padding:28px 20px 8px}
.hub-hero .cake{font-size:84px;line-height:1;filter:drop-shadow(0 6px 0 rgba(255,138,61,.35))}
.hub-hero h2{font-size:44px;margin:10px 0 6px;color:#e65100;line-height:1.25}
.hub-hero p{font-size:22px;margin:0;color:#555;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:28px 32px 40px;max-width:1200px;margin:0 auto;width:100%}
@media (max-width:900px){.cards{grid-template-columns:1fr}}
.card{appearance:none;border:4px solid #ffcc80;background:#fff;border-radius:24px;padding:28px 18px 24px;text-align:center;cursor:pointer;box-shadow:0 8px 0 #ffb74d;transition:transform .12s,box-shadow .12s;font-family:inherit;color:#222}
.card:hover,.card:focus{transform:translateY(-4px);box-shadow:0 12px 0 #ff8a3d;outline:none;border-color:#ff8a3d}
.card:active{transform:translateY(2px);box-shadow:0 4px 0 #ff8a3d}
.card .emo{font-size:72px;line-height:1;display:block;margin-bottom:12px}
.card .en{font-size:26px;font-weight:900;display:block}
.card .cn{font-size:22px;font-weight:700;color:#e65100;display:block;margin-top:4px}
.card .blurb{font-size:15px;color:#666;margin-top:10px;font-weight:600;line-height:1.4}
.game-host{display:none;height:100%}
.game-host.active{display:flex;flex-direction:column}
button.ssBtn{background:#6a1b9a;color:#fff;border-color:#4a148c;font-weight:800}
button.ssBtn.on{background:#f9a825;color:#222;border-color:#f9a825;box-shadow:0 0 0 3px rgba(249,168,37,.45)}

</style>
</head>
<body>

<div id="hub">
  <div class="hub-top">
    <h1>🎉 Family Party Games 家庭派对游戏</h1>
    <button class="big" id="hubOpenDisplay">📺 Open big screen 打开大屏幕</button>
    <button type="button" class="ssBtn" id="ssBtn">🎂 Screensaver 生日屏保</button>
    <span class="score">Team A: <span id="sa">0</span><button data-t="a">+1</button></span>
    <span class="score">Team B: <span id="sb">0</span><button data-t="b">+1</button></span>
    <button class="warn" id="resetScores">↺ Reset scores 重置比分</button>
    <label class="dd">🎵 Music
      <select id="musicVol">
        <option value="0">🔇 Off</option>
        <option value="0.15">Low</option>
        <option value="0.3" selected>Medium</option>
        <option value="0.55">High</option>
      </select>
    </label>
    <label class="dd">🔔 Sounds
      <select id="sfxVol">
        <option value="0">🔇 Off</option>
        <option value="0.3">Low</option>
        <option value="0.6" selected>Medium</option>
        <option value="1">High</option>
      </select>
    </label>
    <button id="muteAll">🔇 Mute all 全部静音</button>
  </div>
  <div class="hub-hero">
    <div class="cake">🎂</div>
    <h2>Happy Birthday 生日快乐!</h2>
    <p>Choose a game 请选择游戏</p>
  </div>
  <div class="cards">
    <button type="button" class="card" data-game="pic">
      <span class="emo">🎨</span>
      <span class="en">Pictionary</span>
      <span class="cn">你画我猜</span>
      <span class="blurb">Draw on the laptop. Family guesses on the big screen.</span>
    </button>
    <button type="button" class="card" data-game="cn">
      <span class="emo">🀄</span>
      <span class="en">Chinese Game</span>
      <span class="cn">中文游戏</span>
      <span class="blurb">看图猜、接龙、汉字加减、古诗填空、猜字谜。</span>
    </button>
    <button type="button" class="card" data-game="bg">
      <span class="emo">🧠</span>
      <span class="en">Brain Teasers</span>
      <span class="cn">脑筋急转弯</span>
      <span class="blurb">Fun maths, riddles, IQ puzzles, and more party teasers.</span>
    </button>
  </div>
</div>
<div id="game-pic" class="game-host" hidden></div>
<div id="game-cn" class="game-host" hidden></div>
<div id="game-bg" class="game-host" hidden></div>

<script>

const Party = (()=>{
  const KEY="partyGamesAudio";
  let musicVol=0.3, sfxVol=0.6, allMuted=false;
  let AC=null,master,musicG,sfxG,musicOn=false,nextT=0,step=0,schedTimer=null;
  let disp=null, mounted=null, active=null;
  const games={};
  let scoreA=0, scoreB=0;

  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function audio(){
    if(AC){if(AC.state==="suspended") AC.resume(); return;}
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.connect(AC.destination);
    musicG=AC.createGain();musicG.connect(master);
    sfxG=AC.createGain();sfxG.connect(master);
    applyVol();startMusic();
  }
  function applyVol(){
    if(!AC)return;
    master.gain.value=allMuted?0:1;
    musicG.gain.value=+musicVol;
    sfxG.gain.value=+sfxVol;
  }
  function bell(m,t,dur,dest,vol,type){
    const o=AC.createOscillator(),o2=AC.createOscillator(),g=AC.createGain();
    o.type=type||"triangle";o2.type="sine";o.frequency.value=mtof(m);o2.frequency.value=mtof(m)*2;
    const g2=AC.createGain();g2.gain.value=0.25;o2.connect(g2);g2.connect(g);o.connect(g);g.connect(dest);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.start(t);o2.start(t);o.stop(t+dur+0.05);o2.stop(t+dur+0.05);
  }
  const MEL=[72,76,79,76,77,81,79,0, 76,79,84,79,77,76,74,0, 72,76,79,76,77,81,79,77, 76,74,71,74,72,0,79,0];
  const BASS=[48,53,48,55];const EIGHTH=0.27;
  function startMusic(){
    if(musicOn)return;musicOn=true;nextT=AC.currentTime+0.1;step=0;
    schedTimer=setInterval(()=>{
      while(nextT<AC.currentTime+1.2){
        const n=MEL[step%32];
        if(n)bell(n,nextT,0.5,musicG,0.35);
        if(step%2===0)bell(BASS[Math.floor((step%32)/8)]+(step%4===2?7:0),nextT,0.45,musicG,0.18,"sine");
        nextT+=EIGHTH;step++;
      }
    },40);
  }
  function sfx(kind){
    if(!AC)return;const t=AC.currentTime;
    if(kind==="new")[72,76,79,84].forEach((m,i)=>bell(m,t+i*0.08,0.35,sfxG,0.5));
    if(kind==="tick")bell(96,t,0.08,sfxG,0.25,"sine");
    if(kind==="score")[88,95].forEach((m,i)=>bell(m,t+i*0.09,0.3,sfxG,0.45,"square"));
    if(kind==="reveal"){[72,76,79,84,79,84,88].forEach((m,i)=>bell(m,t+i*0.09,0.45,sfxG,0.5));[84,88,91].forEach(m=>bell(m,t+0.7,0.9,sfxG,0.3));}
    if(kind==="timeup")[67,66,65,62].forEach((m,i)=>bell(m,t+i*0.25,i===3?0.8:0.3,sfxG,0.5,"sawtooth"));
    if(kind==="pop")bell(84,t,0.12,sfxG,0.3,"sine");
    if(kind==="wrong")[62,58].forEach((m,i)=>bell(m,t+i*0.12,0.25,sfxG,0.45,"sawtooth"));
  }
  function loadAudio(){
    try{
      const s=JSON.parse(localStorage.getItem(KEY)||"null");
      if(s){
        if(s.musicVol!=null) musicVol=+s.musicVol;
        if(s.sfxVol!=null) sfxVol=+s.sfxVol;
        if(s.muted!=null) allMuted=!!s.muted;
      }
    }catch(e){}
  }
  function saveAudio(){
    try{localStorage.setItem(KEY,JSON.stringify({musicVol,sfxVol,muted:allMuted}));}catch(e){}
  }
  function muteLabel(){return allMuted?"🔊 Unmute all 取消静音":"🔇 Mute all 全部静音";}
  function allRoots(){
    const list=[document];
    Object.values(games).forEach(g=>{if(g.root) list.push(g.root);});
    return list;
  }
  function syncAudioControls(){
    allRoots().forEach(r=>{
      const mv=r.getElementById&&r.getElementById("musicVol");
      const sv=r.getElementById&&r.getElementById("sfxVol");
      const mb=r.getElementById&&r.getElementById("muteAll");
      if(mv) mv.value=String(musicVol);
      if(sv) sv.value=String(sfxVol);
      if(mb) mb.textContent=muteLabel();
    });
  }
  function bindControls(root){
    const mv=root.getElementById("musicVol");
    const sv=root.getElementById("sfxVol");
    const mb=root.getElementById("muteAll");
    if(mv){mv.value=String(musicVol);mv.onchange=()=>{audio();musicVol=+mv.value;applyVol();syncAudioControls();saveAudio();sfx("pop");};}
    if(sv){sv.value=String(sfxVol);sv.onchange=()=>{audio();sfxVol=+sv.value;applyVol();syncAudioControls();saveAudio();sfx("pop");};}
    if(mb){mb.textContent=muteLabel();mb.onclick=()=>{audio();allMuted=!allMuted;applyVol();syncAudioControls();saveAudio();};}
    const sb=root.getElementById("ssBtn");
    if(sb){sb.textContent=ssButtonLabel();sb.classList.toggle("on",ssVisible);sb.onclick=()=>{audio();toggleSS();};}
  }

  function scoresText(){return "Team A: "+scoreA+"   ·   Team B: "+scoreB;}
  function syncScores(){
    allRoots().forEach(r=>{
      const a=r.getElementById&&r.getElementById("sa");
      const b=r.getElementById&&r.getElementById("sb");
      if(a) a.textContent=String(scoreA);
      if(b) b.textContent=String(scoreB);
    });
    if(disp&&!disp.closed){
      const sc=disp.document.getElementById("sc");
      if(sc) sc.textContent=scoresText();
    }
  }
  function addScore(t){
    if(t==="a") scoreA++; else if(t==="b") scoreB++;
    syncScores();
    sfx("score");
    const g=games[active];
    // each game's push updates the big screen (including the score line)
    // We trigger it by clicking nothing; call through a custom event on the root if needed.
    // The game IIFEs close over push(). We expose it on the game object below if present.
    if(g&&typeof g.push==="function") g.push();
  }
  function resetScores(){
    scoreA=0;scoreB=0;syncScores();sfx("pop");
    const g=games[active];
    if(g&&typeof g.push==="function") g.push();
  }


  let ssWanted=true, ssVisible=false, ssIdleTimer=null, ssBoundWin=null;
  const SS_IDLE_MS=120000;

  const SS_CSS = `
#birthdaySS{position:fixed;inset:0;z-index:99999;display:none;overflow:hidden;cursor:pointer;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(255,160,80,.22), transparent 42%),
    radial-gradient(ellipse at 50% 100%, #6b1030 0%, #2a0a3a 46%, #12061c 100%);
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;color:#fff}
#birthdaySS.show{display:block}
.ss-layer-anim{position:absolute;inset:0;pointer-events:none}
.ss-star{position:absolute;width:7px;height:7px;background:#fff;border-radius:50%;
  box-shadow:0 0 8px 2px #fff,0 0 16px 4px rgba(255,220,120,.7);
  animation:ss-twinkle 1.6s ease-in-out infinite}
.ss-star.s2{width:4px;height:4px}
@keyframes ss-twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.35)}}
.ss-balloon{position:absolute;bottom:-30%;width:58px;height:76px;
  border-radius:50% 50% 50% 50%/58% 58% 42% 42%;
  animation:ss-floatUp linear infinite;
  box-shadow:inset -10px -8px 0 rgba(0,0,0,.12),0 8px 16px rgba(0,0,0,.25)}
.ss-balloon::before{content:"";position:absolute;left:50%;bottom:-8px;width:10px;height:10px;margin-left:-5px;
  background:inherit;border-radius:2px;transform:rotate(45deg);box-shadow:none}
.ss-balloon::after{content:"";position:absolute;top:100%;left:50%;width:2px;height:70px;margin-left:-1px;
  background:rgba(255,255,255,.55)}
@keyframes ss-floatUp{
  0%{transform:translateY(0) rotate(-6deg)}
  50%{transform:translateY(-60vh) rotate(7deg)}
  100%{transform:translateY(-125vh) rotate(-6deg)}
}
.ss-bit{position:absolute;top:-20px;border-radius:2px;animation:ss-fall linear infinite}
.ss-bit.round{border-radius:50%}
@keyframes ss-fall{
  0%{transform:translateY(-10px) rotate(0deg);opacity:1}
  90%{opacity:1}
  100%{transform:translateY(110vh) rotate(720deg);opacity:.2}
}
.ss-heart{position:absolute;width:18px;height:18px;background:#ff6b9d;transform:rotate(-45deg);
  animation:ss-heartUp linear infinite;opacity:.9;filter:drop-shadow(0 0 6px rgba(255,107,157,.8))}
.ss-heart::before,.ss-heart::after{content:"";position:absolute;width:18px;height:18px;background:#ff6b9d;border-radius:50%}
.ss-heart::before{top:-9px;left:0}
.ss-heart::after{top:0;left:9px}
@keyframes ss-heartUp{
  0%{transform:rotate(-45deg) translateY(0) scale(.7);opacity:0}
  15%{opacity:.95}
  100%{transform:rotate(-45deg) translateY(-100vh) scale(1.2);opacity:0}
}
.ss-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 20px 80px;z-index:2}
.ss-cake-wrap{position:relative;width:220px;height:190px;animation:ss-bounce 2.2s ease-in-out infinite;
  filter:drop-shadow(0 16px 18px rgba(0,0,0,.45));margin-bottom:6px}
@keyframes ss-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
.ss-plate{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:210px;height:18px;
  background:#f5e6c8;border-radius:50%;box-shadow:0 8px 0 #c9a87a}
.ss-layer{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.ss-layer.bottom{bottom:16px;width:168px;height:54px;background:linear-gradient(#ff9ec4,#f06292)}
.ss-layer.top{bottom:62px;width:128px;height:46px;background:linear-gradient(#ffe58a,#ffca28)}
.ss-icing{position:absolute;left:6px;right:6px;top:-6px;height:14px;background:#fff0f6;border-radius:12px}
.ss-layer.top .ss-icing{background:#fff8e1}
.ss-drip{position:absolute;top:8px;width:16px;height:20px;border-radius:0 0 12px 12px;background:#fff0f6}
.ss-layer.top .ss-drip{background:#fff8e1}
.ss-candle{position:absolute;width:8px;height:30px;border-radius:3px;bottom:100%;box-shadow:inset -2px 0 0 rgba(0,0,0,.15)}
.ss-flame{position:absolute;top:-20px;left:50%;width:12px;height:18px;margin-left:-6px;
  background:radial-gradient(circle at 50% 70%,#fff 0 18%,#ffd54f 40%,#ff6d00 72%,transparent 73%);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
  animation:ss-flicker .22s ease-in-out infinite alternate;
  filter:drop-shadow(0 0 8px #ffb300)}
@keyframes ss-flicker{from{transform:scale(1) rotate(-8deg);opacity:.85}to{transform:scale(1.2,1.3) rotate(9deg);opacity:1}}
.ss-title{font-size:clamp(44px,7.6vw,104px);font-weight:900;color:#fffbe6;margin:10px 0 0;line-height:1.15;letter-spacing:.01em;
  text-shadow:0 0 22px rgba(255,200,80,.95),0 4px 0 #b8860b,0 10px 28px rgba(0,0,0,.55);
  animation:ss-glow 2.8s ease-in-out infinite}
.ss-sub{font-size:clamp(34px,5.8vw,78px);font-weight:900;color:#ffe082;margin:8px 0 0;line-height:1.2;
  text-shadow:0 0 18px rgba(255,180,50,.8),0 3px 0 #8d4a00,0 8px 22px rgba(0,0,0,.5)}
@keyframes ss-glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18)}}
.ss-hint{margin-top:28px;font-size:clamp(16px,2vw,22px);font-weight:700;color:#ffe0c0;opacity:.9;
  text-shadow:0 2px 8px rgba(0,0,0,.6)}
`;

  function ssMarkup(){
    const colors=["#ff4d6d","#ffd166","#4cc9f0","#f72585","#80ed99","#ff9e00","#c77dff","#ffffff"];
    let h='<div class="ss-layer-anim">';
    const stars=[[8,12,1],[20,8,2],[35,18,1],[50,6,2],[65,14,1],[78,9,2],[90,16,1],[12,40,2],[88,38,1],[30,8,2],[70,22,1],[42,20,2],[55,30,1],[15,22,2],[82,28,1],[25,28,2],[60,10,1],[5,24,2]];
    stars.forEach((p,i)=>{
      h+=`<div class="ss-star${p[2]===2?" s2":""}" style="left:${p[0]}%;top:${p[1]}%;animation-delay:${(i%7)*0.28}s"></div>`;
    });
    const balloons=[[6,"#ff4d6d",18,0],[14,"#ffd166",22,3],[22,"#4cc9f0",16,6],[30,"#f72585",20,2],[40,"#ffffff",24,8],[62,"#80ed99",19,4],[70,"#ff9e00",23,1],[78,"#c77dff",17,5],[86,"#4cc9f0",21,7],[94,"#ff4d6d",15,2.5],[10,"#f72585",26,4.5],[54,"#ffd166",18,1.5]];
    balloons.forEach(b=>{
      h+=`<div class="ss-balloon" style="left:${b[0]}%;background:${b[1]};animation-duration:${b[2]}s;animation-delay:-${b[3]}s"></div>`;
    });
    for(let i=0;i<46;i++){
      const c=colors[i%colors.length], w=8+(i%7), hgt=6+(i%9), left=(i*2.1+3)%100, dur=6+(i%8), delay=i%12, round=i%3===0?" round":"";
      h+=`<div class="ss-bit${round}" style="left:${left}%;width:${w}px;height:${hgt}px;background:${c};animation-duration:${dur}s;animation-delay:-${delay}s"></div>`;
    }
    const hearts=[[12,18,0],[28,22,4],[48,16,2],[68,24,6],[84,19,3],[8,26,8],[92,21,5],[36,20,7]];
    hearts.forEach(p=>{
      h+=`<div class="ss-heart" style="left:${p[0]}%;bottom:${p[1]-20}%;animation-duration:${p[1]}s;animation-delay:-${p[2]}s"></div>`;
    });
    h+=`</div>
    <div class="ss-center">
      <div class="ss-cake-wrap" aria-hidden="true">
        <div class="ss-plate"></div>
        <div class="ss-layer bottom"><div class="ss-icing"></div>
          <div class="ss-drip" style="left:18%"></div><div class="ss-drip" style="left:48%"></div><div class="ss-drip" style="left:74%"></div>
        </div>
        <div class="ss-layer top">
          <div class="ss-icing"></div>
          <div class="ss-drip" style="left:20%"></div><div class="ss-drip" style="left:52%"></div><div class="ss-drip" style="left:76%"></div>
          <div class="ss-candle" style="left:18%;background:#5c6bc0"><div class="ss-flame"></div></div>
          <div class="ss-candle" style="left:46%;background:#ef5350"><div class="ss-flame" style="animation-delay:.1s"></div></div>
          <div class="ss-candle" style="left:74%;background:#26a69a"><div class="ss-flame" style="animation-delay:.2s"></div></div>
        </div>
      </div>
      <div class="ss-title">Happy Birthday Ah Ma</div>
      <div class="ss-sub">生日快乐 阿嫲</div>
      <div class="ss-hint">点击或按任意键继续  ·  Click or press any key</div>
    </div>`;
    return h;
  }

  function ssButtonLabel(){
    return ssVisible ? "🎂 Screensaver ON 屏保开" : "🎂 Screensaver 生日屏保";
  }
  function syncSSButtons(){
    allRoots().forEach(r=>{
      const b=r.getElementById&&r.getElementById("ssBtn");
      if(!b) return;
      b.textContent=ssButtonLabel();
      b.classList.toggle("on", ssVisible);
      b.setAttribute("aria-pressed", ssVisible?"true":"false");
    });
  }
  function bindDisplayDismiss(w){
    if(!w||w.closed) return;
    if(ssBoundWin===w && w.__ssBound) return;
    if(ssBoundWin && ssBoundWin!==w){
      try{ssBoundWin.removeEventListener("keydown", onDisplayKey);}catch(e){}
    }
    ssBoundWin=w;
    w.__ssBound=true;
    w.removeEventListener("keydown", onDisplayKey);
    w.addEventListener("keydown", onDisplayKey);
  }
  function onDisplayKey(e){
    if(!ssVisible) return;
    if(e.key==="F11"||e.key==="F12") return;
    hideSS({keepWanted:true});
  }
  function applySS(w){
    if(!w||w.closed) return;
    const D=w.document;
    if(!D||!D.body) return;
    let style=D.getElementById("ssStyle");
    if(!style){
      style=D.createElement("style");
      style.id="ssStyle";
      style.textContent=SS_CSS;
      (D.head||D.body).appendChild(style);
    }
    let root=D.getElementById("birthdaySS");
    if(!root){
      root=D.createElement("div");
      root.id="birthdaySS";

","py":"rén jiān","cn":"即使粉身碎骨也不怕，只为把清白留在世上","en":"It fears not being crushed to powder, so long as purity is left in the world."},{"title":"夏日绝句","author":"李清照","lines":["生当作人杰，死亦为鬼雄。","至今思项羽，不肯过§。"],"ans":"江东","py":"jiāng dōng","cn":"到现在还思念项羽，因为他不肯逃回江东","en":"To this day one thinks of Xiang Yu, who would not cross back east of the river."},{"title":"示儿","author":"陆游","lines":["死去元知万事空，但悲不见九州同。","王师北定中原日，家祭无忘告§。"],"ans":"乃翁","py":"nǎi wēng","cn":"等到朝廷的军队收复中原，家里祭祀时别忘了告诉父亲","en":"When the imperial army has pacified the Central Plain, do not forget to tell your father at the family sacrifice."},{"title":"秋夜将晓出篱门迎凉有感","author":"陆游","lines":["三万里河东入海，五千仞岳上摩天。","遗民泪尽胡尘里，南望§又一年。"],"ans":"王师","py":"wáng shī","cn":"盼望朝廷的军队，又过了一年","en":"The people look south for the imperial army, another year on."},{"title":"嫦娥","author":"李商隐","lines":["云母屏风烛影深，长河渐落晓星沉。","嫦娥应悔偷灵药，碧海青天夜夜§。"],"ans":"心","py":"xīn","cn":"嫦娥应该后悔偷了灵药，对着碧海青天，一夜又一夜地心中思念","en":"Chang'e must regret stealing the elixir, her heart night after night under the blue sea-sky."},{"title":"乐游原","author":"李商隐","lines":["向晚意不适，驱车登古原。","夕阳无限好，只是近§。"],"ans":"黄昏","py":"huáng hūn","cn":"夕阳虽然无限美好，只是已经接近黄昏","en":"The setting sun is infinitely lovely — only, it is near dusk."},{"title":"登飞来峰","author":"王安石","lines":["飞来山上千寻塔，闻说鸡鸣见日升。","不畏浮云遮望眼，自缘身在最§。"],"ans":"高层","py":"gāo céng","cn":"不怕浮云挡住视线，因为自己站在最高层","en":"One does not fear the floating clouds blocking the view, for one stands on the highest level."},{"title":"饮湖上初晴后雨","author":"苏轼","lines":["水光潋滟晴方好，山色空蒙雨亦奇。","欲把西湖比西子，淡妆浓抹总相§。"],"ans":"宜","py":"yí","cn":"想把西湖比作西施，无论淡妆还是浓抹都很合适","en":"If West Lake is compared to Xi Shi, she looks right in light or heavy make-up."},{"title":"惠崇春江晚景","author":"苏轼","lines":["竹外桃花三两枝，春江水暖鸭先知。","蒌蒿满地芦芽短，正是河豚欲上§。"],"ans":"时","py":"shí","cn":"正是河豚要沿江上来的时节","en":"It is just the time when the puffer fish are coming up the river."},{"title":"题临安邸","author":"林升","lines":["山外青山楼外楼，西湖歌舞几时休。","暖风熏得游人醉，直把杭州作§。"],"ans":"汴州","py":"biàn zhōu","cn":"暖风把游人吹醉了，简直把杭州当成了旧都汴州","en":"The warm wind has intoxicated the visitors, who take Hangzhou for Bianzhou."},{"title":"过零丁洋","author":"文天祥","lines":["人生自古谁无死，留取丹心照§。"],"ans":"汗青","py":"hàn qīng","cn":"人从来都有一死，要留下一颗忠心照亮史册","en":"Since ancient times, who has not died? Let a loyal heart shine in the historical record."},{"title":"别董大","author":"高适","lines":["千里黄云白日曛，北风吹雁雪纷纷。","莫愁前路无知己，天下谁人不识§。"],"ans":"君","py":"jūn","cn":"不要担心前面没有知己，天下有谁不认识你呢","en":"Do not worry that there will be no true friends ahead — who in the world does not know you?"},{"title":"芙蓉楼送辛渐","author":"王昌龄","lines":["寒雨连江夜入吴，平明送客楚山孤。","洛阳亲友如相问，一片冰心在§。"],"ans":"玉壶","py":"yù hú","cn":"如果洛阳的亲友问起我，就说我的心像玉壶里的冰一样纯洁","en":"If friends and family in Luoyang ask, say my heart is ice in a jade vase."},{"title":"送元二使安西","author":"王维","lines":["渭城朝雨浥轻尘，客舍青青柳色新。","劝君更尽一杯酒，西出阳关无§。"],"ans":"故人","py":"gù rén","cn":"请再喝一杯酒，往西出了阳关就没有老朋友了","en":"I urge you to have one more cup of wine; west of Yangguan there will be no old friends."},{"title":"赋得古原草送别","author":"白居易","lines":["又送王孙去，萋萋满别§。"],"ans":"情","py":"qíng","cn":"又要送朋友走了，这茂盛的草好像也充满了离别之情","en":"Once more we see a friend off, and the lush grass is full of parting feelings."},{"title":"钱塘湖春行","author":"白居易","lines":["最爱湖东行不足，绿杨阴里白§。"],"ans":"沙堤","py":"shā dī","cn":"最爱湖东这走不够的地方，绿杨树阴下的白沙堤","en":"One never tires of walking east of the lake, on the white sand causeway in the shade of green willows."},{"title":"望岳","author":"杜甫","lines":["岱宗夫如何，齐鲁青未了。","造化钟神秀，阴阳割昏晓。","荡胸生曾云，决眦入归鸟。","会当凌绝顶，一览众山§。"],"ans":"小","py":"xiǎo","cn":"一定要登上最高峰，那时再看，周围的山都会显得很小","en":"I shall climb to the summit, and see all the other mountains look small."},{"title":"春望","author":"杜甫","lines":["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，家书抵万金。","白头搔更短，浑欲不胜§。"],"ans":"簪","py":"zān","cn":"白头发越抓越短，简直要插不住簪子了","en":"The white hair, scratched, grows even shorter — almost too thin to hold a hairpin."},{"title":"游子吟","author":"孟郊","lines":["§手中线，游子身上衣。","临行密密缝，意恐迟迟归。","谁言寸草心，报得三春晖。"],"ans":"慈母","py":"cí mǔ","cn":"慈爱的母亲手里拿着针线","en":"The loving mother's thread is in her hand."},{"title":"回乡偶书","author":"贺知章","lines":["少小离家老大回，§无改鬓毛衰。","儿童相见不相识，笑问客从何处来。"],"ans":"乡音","py":"xiāng yīn","cn":"从小离家，年老才回来，口音还没变","en":"The accent of home is unchanged."},{"title":"水调歌头","author":"苏轼","lines":["但愿§，千里共婵娟。"],"ans":"人长久","py":"rén cháng jiǔ","cn":"希望人人平安长久，千里之外也能共赏明月","en":"May we live long and share the moonlight even a thousand li apart."},{"title":"题西林壁","author":"苏轼","lines":["横看成岭侧成峰，远近高低各不同。","不识§真面目，只缘身在此山中。"],"ans":"庐山","py":"lú shān","cn":"不识庐山真面目","en":"One cannot recognise the true face of Lushan."},{"title":"饮湖上初晴后雨","author":"苏轼","lines":["水光潋滟晴方好，山色空蒙雨亦奇。","欲把西湖比§，淡妆浓抹总相宜。"],"ans":"西子","py":"xī zi","cn":"想把西湖比作西施","en":"If one likens West Lake to Xi Shi."},{"title":"惠崇春江晚景","author":"苏轼","lines":["竹外桃花三两枝，春江水暖§先知。"],"ans":"鸭","py":"yā","cn":"春天江水变暖，鸭子先知道","en":"The ducks are the first to know the spring river has warmed."},{"title":"竹石","author":"郑燮","lines":["咬定青山不放松，立根原在破岩中。","千磨万击还§，任尔东西南北风。"],"ans":"坚劲","py":"jiān jìn","cn":"经受千万次磨炼仍然坚韧有力","en":"After a thousand grindings it is still firm and strong."},{"title":"石灰吟","author":"于谦","lines":["千锤万凿出深山，烈火焚烧若等闲。","粉骨碎身浑不怕，要留§在人间。"],"ans":"清白","py":"qīng bái","cn":"只为把清白留在人间","en":"It only wishes to leave purity in the world."},{"title":"己亥杂诗","author":"龚自珍","lines":["九州生气恃风雷，万马齐喑究可哀。","我劝§重抖擞，不拘一格降人材。"],"ans":"天公","py":"tiān gōng","cn":"我劝老天爷重新振作起来","en":"I advise the Lord of Heaven to rouse himself again."},{"title":"乐游原","author":"李商隐","lines":["向晚意不适，驱车登古原。","夕阳无限§，只是近黄昏。"],"ans":"好","py":"hǎo","cn":"夕阳无限美好","en":"The setting sun is infinitely lovely."},{"title":"登飞来峰","author":"王安石","lines":["飞来山上千寻塔，闻说鸡鸣见日升。","不畏§遮望眼，自缘身在最高层。"],"ans":"浮云","py":"fú yún","cn":"不怕浮云挡住眺望的视线","en":"One does not fear floating clouds blocking the view."},{"title":"芙蓉楼送辛渐","author":"王昌龄","lines":["寒雨连江夜入吴，平明送客楚山孤。","洛阳亲友如相问，一片§在玉壶。"],"ans":"冰心","py":"bīng xīn","cn":"我的心像冰一样纯净，放在玉壶里","en":"A heart of ice in a jade vase."},{"title":"送元二使安西","author":"王维","lines":["渭城朝雨浥轻尘，客舍青青柳色新。","劝君更尽一杯酒，西出§无故人。"],"ans":"阳关","py":"yáng guān","cn":"出了阳关以西，就没有老朋友了","en":"West of Yangguan there are no old friends."},{"title":"别董大","author":"高适","lines":["千里黄云白日曛，北风吹雁雪纷纷。","莫愁前路无§，天下谁人不识君。"],"ans":"知己","py":"zhī jǐ","cn":"不要担心前路没有知己","en":"Do not worry that there will be no true friends on the road ahead."},{"title":"望岳","author":"杜甫","lines":["岱宗夫如何，齐鲁青未了。","造化钟神秀，阴阳割昏晓。","荡胸生曾云，决眦入归鸟。","会当凌§，一览众山小。"],"ans":"绝顶","py":"jué dǐng","cn":"一定要登上最高峰","en":"I shall climb to the very summit."},{"title":"春望","author":"杜甫","lines":["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，§抵万金。","白头搔更短，浑欲不胜簪。"],"ans":"家书","py":"jiā shū","cn":"一封家信比万金还珍贵","en":"A letter from home is worth ten thousand in gold."},{"title":"出塞","author":"王昌龄","lines":["秦时明月汉时关，万里长征人未还。","但使§飞将在，不教胡马度阴山。"],"ans":"龙城","py":"lóng chéng","cn":"只要龙城的飞将军还在","en":"If only the Flying General of Longcheng were still here."}]},"riddle":{"1":[{"riddle":"两个小娃娃，坐在泥土上。","ans":"坐","py":"zuò","why":"两个人（人人）坐在“土”上，就是坐。","cn":"坐下来的坐","en":"to sit"},{"riddle":"一口咬掉牛尾巴。","ans":"告","py":"gào","why":"“牛”去掉尾（一竖），再加“口”，就是告。","cn":"告诉的告","en":"to tell"},{"riddle":"白天加黑夜。","ans":"明","py":"míng","why":"白天是“日”，黑夜有“月”，合起来是明。","cn":"明亮的明","en":"bright"},{"riddle":"一加一不等于二。","ans":"王","py":"wáng","why":"一横加一横，中间再加个“十”（加号），就是王。","cn":"国王的王","en":"king"},{"riddle":"太阳挂在树顶上。","ans":"果","py":"guǒ","why":"“木”上面有个“日”，就是果。","cn":"水果的果","en":"fruit"},{"riddle":"山上再加一座山。","ans":"出","py":"chū","why":"两座“山”叠在一起，小朋友常这样记“出”。","cn":"出去的出","en":"to go out"},{"riddle":"一个人跟着一个人走。","ans":"从","py":"cóng","why":"两个“人”，一个跟随一个，就是从。","cn":"跟随、从来的从","en":"to follow / from"},{"riddle":"三个人在一起。","ans":"众","py":"zhòng","why":"三个“人”合在一起，就是众。","cn":"众人的众","en":"a crowd"},{"riddle":"两棵树并排站。","ans":"林","py":"lín","why":"两个“木”在一起，就是林。","cn":"树林的林","en":"woods"},{"riddle":"三棵树站一起。","ans":"森","py":"sēn","why":"三个“木”在一起，就是森。","cn":"森林的森","en":"forest"},{"riddle":"一边是女，一边是子。","ans":"好","py":"hǎo","why":"“女”加“子”，就是好。","cn":"好坏的好","en":"good"},{"riddle":"大门里面一张口。","ans":"问","py":"wèn","why":"“门”里有“口”，就是问。","cn":"问答的问","en":"to ask"},{"riddle":"大门里面一个日。","ans":"间","py":"jiān","why":"“门”里有“日”，就是间。","cn":"中间的间","en":"between / room"},{"riddle":"大门里面一只耳。","ans":"闻","py":"wén","why":"“门”里有“耳”，就是闻。","cn":"听闻的闻","en":"to hear / to smell"},{"riddle":"大门里面一颗心。","ans":"闷","py":"mèn","why":"“门”里有“心”，就是闷。","cn":"闷热、苦闷的闷","en":"stuffy / bored"},{"riddle":"大门里面一个人。","ans":"闪","py":"shǎn","why":"“门”里有“人”，就是闪。","cn":"闪电、躲开的闪","en":"to flash / to dodge"},{"riddle":"一只手遮在眼睛上。","ans":"看","py":"kàn","why":"“手”在“目”上，就是看。","cn":"看见的看","en":"to look"},{"riddle":"人在云上走。","ans":"会","py":"huì","why":"“人”在“云”上，就是会。","cn":"开会、会做的会","en":"can / meeting"},{"riddle":"千里走在一起。","ans":"重","py":"zhòng","why":"“千”加“里”，就是重。","cn":"轻重、重复的重","en":"heavy / again"},{"riddle":"六十天。","ans":"朋","py":"péng","why":"一个月大约三十天，两个“月”大约六十天，就是朋。","cn":"朋友的朋","en":"friend (in 朋友)"},{"riddle":"上面是竹子，下面是毛。","ans":"笔","py":"bǐ","why":"“竹”加“毛”，就是笔。","cn":"毛笔、铅笔的笔","en":"pen / brush"},{"riddle":"很小很小的土。","ans":"尘","py":"chén","why":"“小”加“土”，就是尘。","cn":"灰尘的尘","en":"dust"},{"riddle":"上边小，下边大。","ans":"尖","py":"jiān","why":"“小”在“大”上，就是尖。","cn":"尖尖的尖","en":"pointed"},{"riddle":"在田里出大力。","ans":"男","py":"nán","why":"“田”加“力”，就是男。","cn":"男女的男","en":"male"},{"riddle":"不正就是它。","ans":"歪","py":"wāi","why":"“不”加“正”，就是歪。","cn":"歪斜的歪","en":"crooked"},{"riddle":"左边三点水，右边一只眼。","ans":"泪","py":"lèi","why":"“氵”加“目”，就是泪。","cn":"眼泪的泪","en":"tears"},{"riddle":"人靠在树旁边。","ans":"休","py":"xiū","why":"“人”靠着“木”，就是休。","cn":"休息的休","en":"to rest"},{"riddle":"十字下面一张口。","ans":"古","py":"gǔ","why":"“十”加“口”，就是古。","cn":"古代的古","en":"ancient"},{"riddle":"大口里面套小口。","ans":"回","py":"huí","why":"一个大口套一个小口，就是回。","cn":"回来的回","en":"to return"},{"riddle":"木头走进门里。","ans":"闲","py":"xián","why":"“门”里有“木”，就是闲。","cn":"清闲的闲","en":"idle / free"},{"riddle":"马儿冲进门里。","ans":"闯","py":"chuǎng","why":"“门”里有“马”，就是闯。","cn":"闯进去的闯","en":"to rush in"},{"riddle":"两个火堆在一起。","ans":"炎","py":"yán","why":"两个“火”，就是炎。","cn":"炎热的炎","en":"scorching"},{"riddle":"两个太阳叠一起。","ans":"昌","py":"chāng","why":"两个“日”，就是昌。","cn":"昌盛的昌","en":"prosperous"},{"riddle":"一个晚上又一个晚上。","ans":"多","py":"duō","why":"两个“夕”，就是多。","cn":"多少的多","en":"many"},{"riddle":"舌头尝到甘味。","ans":"甜","py":"tián","why":"“舌”加“甘”，就是甜。","cn":"甜食的甜","en":"sweet"},{"riddle":"鱼和羊在一起。","ans":"鲜","py":"xiān","why":"“鱼”加“羊”，就是鲜。","cn":"新鲜的鲜","en":"fresh"},{"riddle":"禾苗遇见火。","ans":"秋","py":"qiū","why":"“禾”加“火”，就是秋。","cn":"秋天的秋","en":"autumn"},{"riddle":"太阳旁边一个青。","ans":"晴","py":"qíng","why":"“日”加“青”，就是晴。","cn":"晴天的晴","en":"sunny"},{"riddle":"三点水旁边一个青。","ans":"清","py":"qīng","why":"“氵”加“青”，就是清。","cn":"清澈的清","en":"clear"},{"riddle":"用眼睛看这个青。","ans":"睛","py":"jīng","why":"“目”加“青”，就是睛。","cn":"眼睛的睛","en":"eye (in 眼睛)"},{"riddle":"草字头下面一块田。","ans":"苗","py":"miáo","why":"“艹”加“田”，就是苗。","cn":"禾苗的苗","en":"seedling"},{"riddle":"八和刀放一起。","ans":"分","py":"fēn","why":"“八”加“刀”，就是分。","cn":"分开的分","en":"to divide"},{"riddle":"口字中间一根棍。","ans":"中","py":"zhōng","why":"“口”中有一竖，就是中。","cn":"中间的中","en":"middle"},{"riddle":"太阳升到地平线上。","ans":"旦","py":"dàn","why":"“日”在一横上，就是旦。","cn":"旦夕、元旦的旦","en":"dawn"},{"riddle":"自己的心里。","ans":"息","py":"xī","why":"“自”加“心”，就是息。","cn":"气息、休息的息","en":"breath / rest"}],"2":[{"riddle":"人有他大，天没有他大。","ans":"一","py":"yī","why":"“人”加“一”是“大”，“天”减“一”也是“大”。","cn":"数字一","en":"one"},{"riddle":"一百减去一。","ans":"白","py":"bái","why":"“百”去掉“一”，就是白。","cn":"白色的白","en":"white"},{"riddle":"上不来，下不去。","ans":"卡","py":"kǎ","why":"“上”和“下”合在一起，就是卡。","cn":"卡片、卡住的卡","en":"card / to get stuck"},{"riddle":"八十八。","ans":"米","py":"mǐ","why":"“八十八”三个字叠在一起，很像“米”。","cn":"米粒的米","en":"rice"},{"riddle":"七十二小时。","ans":"晶","py":"jīng","why":"一天二十四小时，三天七十二小时；三个“日”就是晶。","cn":"水晶、亮晶晶的晶","en":"crystal / sparkling"},{"riddle":"王先生白了头。","ans":"皇","py":"huáng","why":"“白”在“王”上，就是皇。","cn":"皇帝的皇","en":"emperor"},{"riddle":"十八个儿子。","ans":"李","py":"lǐ","why":"“十八”合起来像“木”，再加“子”，就是李。","cn":"李子、姓李的李","en":"plum / the surname Li"},{"riddle":"田上有一颗心。","ans":"思","py":"sī","why":"“田”加“心”，就是思。","cn":"思想的思","en":"to think"} function audio(){Party.audio();}

let disp=null,tleft=0,tint=null,revealed=false,ico='🎉',msg='';
let current=null,chainLen=0,chainHint='',chainList=[];
const used={guess:new Set(),add:new Set(),poem:new Set(),riddle:new Set(),chain_word:new Set(),chain_chengyu:new Set()};

const $ = id=>root.getElementById(id);
function mode(){return $('mode').value;}
function lvl(){return $('lvl').value;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function stripTone(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function pyParts(py){return (py||'').trim().split(/\s+/);}
function lastSyl(py){const p=pyParts(py);return p[p.length-1]||'';}
function firstSyl(py){return pyParts(py)[0]||'';}
function charPy(ch){return DATA.charPy[ch]||'';}

function fillLevels(){
  const m=mode(), sel=$('lvl'), cur=sel.value;
  sel.innerHTML=LVL_OPTS[m].map(([v,t])=>'<option value="'+v+'">'+t+'</option>').join('');
  const ok=LVL_OPTS[m].some(([v])=>v===cur);
  sel.value=ok?cur:LVL_OPTS[m][0][0];
}
function usedSet(){
  const m=mode();
  if(m==='chain') return used['chain_'+lvl()];
  return used[m];
}
function itemKey(it){
  const m=mode();
  if(m==='guess') return it.w;
  if(m==='add') return it.parts.join(it.op)+it.ans;
  if(m==='poem') return it.title+'|'+it.ans;
  if(m==='riddle') return it.ans+'|'+it.riddle;
  if(m==='chain') return it.w;
  return JSON.stringify(it);
}
function pool(){
  const m=mode(), l=lvl();
  if(m==='guess') return DATA.guess[l]||[];
  if(m==='add') return DATA.add[l]||[];
  if(m==='poem') return DATA.poem[l]||[];
  if(m==='riddle') return DATA.riddle[l]||[];
  if(m==='chain') return l==='chengyu'?DATA.chainChengyu:DATA.chainWords;
  return [];
}
function pick(arr,uset,keyFn){
  let left=arr.filter(x=>!uset.has(keyFn(x)));
  if(!left.length){arr.forEach(x=>uset.delete(keyFn(x)));left=arr.slice();}
  if(!left.length) return null;
  const it=left[Math.floor(Math.random()*left.length)];
  uset.add(keyFn(it));
  return it;
}

function suggestions(fromWord, fromPy, n){
  const list=pool(), last=[...fromWord].pop(), lp=stripTone(lastSyl(fromPy)||charPy(last));
  const exact=[], homo=[];
  for(const it of list){
    if(it.w===fromWord) continue;
    if(it.w[0]===last) exact.push(it);
    else if(lp && stripTone(firstSyl(it.py))===lp) homo.push(it);
  }
  const mix=[];
  const take=(arr)=>{
    const copy=arr.slice();
    while(copy.length && mix.length<n){
      const i=Math.floor(Math.random()*copy.length);
      mix.push(copy.splice(i,1)[0]);
    }
  };
  take(exact); take(homo);
  return mix;
}

function startTimer(){stopTimer();tleft=+$('secs').value;tick();tint=setInterval(()=>{tleft--;tick();if(tleft>0&&tleft<=10)sfx('tick');if(tleft<=0){stopTimer();revealed=true;ico='⏰';msg='时间到！Time’s up!';push();updateHost();sfx('timeup');}},1000);}
function stopTimer(){if(tint)clearInterval(tint);tint=null;}
function tick(){$('timer').textContent='⏱ '+tleft;if(disp&&!disp.closed){const t=disp.document.getElementById('t');if(t){t.textContent='⏱ '+tleft;t.style.color=tleft<=10?'#e53935':'#222';}}}

function onModeChange(){
  fillLevels();
  current=null;revealed=false;msg='';ico='🎉';chainLen=0;chainHint='';chainList=[];
  stopTimer();tleft=+$('secs').value;tick();
  $('howto').textContent=HOWTO[mode()];
  updateHost();push();
}

function nextItem(){
  const m=mode();
  if(m==='chain'){ newChain(); return; }
  current=pick(pool(), usedSet(), itemKey);
  if(!current){alert('这一关暂时没有题目。');return;}
  revealed=false;ico='🎉';msg='';chainHint='';
  startTimer();updateHost();push();sfx('new');
}

function doReveal(){
  if(!current) return;
  revealed=true;ico='🎉';msg='';stopTimer();updateHost();push();sfx('reveal');
}

function newChain(){
  current=pick(pool(), usedSet(), itemKey);
  if(!current){alert('词库暂时没有词。');return;}
  chainLen=1;chainHint='';chainList=[current.w];revealed=false;ico='🎉';msg='';
  startTimer();updateHost();push();sfx('new');
}
function chainAccept(word){
  word=(word||'').trim();
  if(!current||!word) return;
  const need=[...current.w].pop();
  const needPy=stripTone(lastSyl(current.py)||charPy(need));
  const first=word[0];
  const got=stripTone(charPy(first)||firstSyl((pool().find(x=>x.w===word)||{}).py||''));
  const okExact=first===need;
  const okHomo=needPy && got && got===needPy;
  if(!okExact && !okHomo){
    const go=confirm('「'+word+'」不是以「'+need+'」开头（也不是已知同音字）。\n主持要强制接上吗？\nThis does not start with '+need+' (or a known homophone). Accept anyway?');
    if(!go) return;
  }
  let it=pool().find(x=>x.w===word);
  if(!it){
    const pys=[...word].map(ch=>charPy(ch)||'');
    it={w:word,py:pys.every(Boolean)?pys.join(' '):'',extra:true};
  }
  usedSet().add(word);
  current=it;chainLen++;chainHint='';chainList.push(word);revealed=false;ico='🎉';msg='';
  startTimer();updateHost();push();sfx('score');
}
function chainHintShow(){
  if(!current) return;
  const sugs=suggestions(current.w,current.py,5);
  if(!sugs.length){alert('这一轮暂时没有现成的建议，请大家自由接龙。');return;}
  chainHint=sugs[0];
  updateHost();push();sfx('pop');
}

function updateHost(){
  const box=$('hostMain'), m=mode();
  const remain=(()=>{const p=pool(),u=usedSet();const left=p.filter(x=>!u.has(itemKey(x))).length;return '题库 pool: '+p.length+'　还剩 left: '+left;})();
  let html='<div class="note" id="remain">'+remain+'</div>';
  if(m!=='chain'){
    let secret='—', py='', mean='';
    if(current){
      if(m==='guess'){secret=current.w;py=current.py;mean=current.cn+'  /  '+current.en;}
      else if(m==='add'){secret=current.parts.join(' '+current.op+' ')+' ＝ '+current.ans;py=current.py;mean=current.cn+'  /  '+current.en;}
      else if(m==='poem'){secret='《'+current.title+'》 '+current.author+'　答案：'+current.ans;py=current.py;mean=current.cn+'  /  '+current.en;}
      else if(m==='riddle'){secret=current.ans;py=current.py;mean=current.why+'　'+current.cn+'  /  '+current.en;}
    }
    html+='<div class="row"><span>答案 Answer:</span><span id="secret"'+(current?'':' class="hidden"')+'>'+esc(secret)+'</span>';
    html+='<button id="peek">👁 显示／隐藏 Show / hide</button>';
    html+='<button class="big" id="next">▶ 下一题 + 计时 New + timer</button>';
    html+='<button id="reveal">🎉 揭晓 Reveal</button></div>';
    if(current){html+='<div class="py-h">'+esc(py)+'</div><div class="mean-h">'+esc(mean)+'</div>';if(m==='guess'&&current.emoji){const chs=[...current.w];html+='<div class="mean-h">线索 Clue</div><div>'+current.emoji.map((e,i)=>'<span style="display:inline-block;text-align:center;margin:0 12px 0 0;font-size:30px;line-height:1.15">'+(e==='?'||e==='❔'?'<span style="color:#888">?</span>':e)+'<br><small style="font-size:18px">'+esc(chs[i]||'')+'</small></span>').join('')+'</div>';}}
  } else {
    if(!current){
      html+='<div class="row"><button class="big" id="next">▶ 开始接龙 + 计时 Start chain + timer</button></div>';
    } else {
      const chars=[...current.w];
      const last=chars[chars.length-1];
      const lp=lastSyl(current.py)||charPy(last);
      html+='<div class="row"><span>当前 Current:</span><span id="secret">'+esc(chars.slice(0,-1).join(''))+'<span class="lastc">'+esc(last)+'</span></span>';
      html+='<span class="py-h">末字 '+esc(last)+'　'+esc(lp)+'</span>';
      html+='<span class="mean-h">接龙长度 Length: <b style="font-size:28px">'+chainLen+'</b></span></div>';
      const sugs=suggestions(current.w,current.py,5);
      html+='<div class="note">建议 Suggestions（点一下即可接上）：</div><div class="sug" id="sugs">';
      html+=sugs.map(s=>'<button type="button" data-w="'+esc(s.w)+'">'+esc(s.w)+' <small>'+esc(s.py)+'</small></button>').join('')||'<span class="note">没有现成建议，请自己输入（同音字也可以）。</span>';
      html+='</div>';
      html+='<div class="row"><input id="chainIn" type="text" placeholder="输入下一个词 type the next word" autocomplete="off">';
      html+='<button class="big" id="accept">✅ 接上了</button>';
      html+='<button class="alt" id="hint">💡 提示 Hint</button>';
      html+='<button id="next">🔄 换一个 New word</button></div>';
      html+='<div class="note">同音字也可以 Homophones OK. 主持是裁判，也可以输入词库里没有的词。</div>';
      if(chainHint) html+='<div class="mean-h">已在大屏幕提示 Hint on big screen: '+esc(chainHint.w)+'</div>';
    }
  }
  box.innerHTML=html;
  const peek=$('peek'); if(peek) peek.onclick=()=>$('secret').classList.toggle('hidden');
  const next=$('next'); if(next) next.onclick=nextItem;
  const rev=$('reveal'); if(rev) rev.onclick=doReveal;
  const acc=$('accept'); if(acc) acc.onclick=()=>chainAccept($('chainIn').value);
  const hin=$('hint'); if(hin) hin.onclick=chainHintShow;
  const inp=$('chainIn'); if(inp) inp.addEventListener('keydown',e=>{if(e.key==='Enter')chainAccept(inp.value);});
  const sug=$('sugs'); if(sug) sug.onclick=e=>{const b=e.target.closest('button[data-w]'); if(b) chainAccept(b.getAttribute('data-w'));};
}

function openDisplay(){
  disp=Party.mount('cn', DISPLAY_HTML);
  if(!disp){alert('请允许弹出窗口，然后再点一次。\\nPlease allow pop-ups for this page, then click again.');return;}
  setTimeout(()=>{push();tick();},80);
}

function boxesHTML(s, fill){
  return '<div class="boxes">'+[...s].map(ch=>'<div class="box">'+(fill?esc(ch):'')+'</div>').join('')+'</div>';
}
function guessColsHTML(item, revealed){
  const chars=[...item.w];
  const emos=item.emoji||[];
  const pys=(item.py||'').trim().split(/\s+/);
  let h='<div class="gcols">';
  for(let i=0;i<chars.length;i++){
    const em=emos[i]||'?';
    const isQ=em==='?'||em==='❔';
    h+='<div class="gcol">';
    h+='<div class="gem">'+(isQ?'<span class="gunk">?</span>':em)+'</div>';
    h+='<div class="box">'+(revealed?esc(chars[i]):'')+'</div>';
    if(revealed&&pys[i]) h+='<div class="gpy">'+esc(pys[i])+'</div>';
    h+='</div>';
  }
  return h+'</div>';
}

function push(){
  if(!disp||disp.closed)return;
  const D=disp.document, stage=D.getElementById('stage'); if(!stage)return;
  D.getElementById('title').textContent='🎉 '+MODE_NAMES[mode()][0];
  D.getElementById('sc').textContent='A队 Team A: '+$('sa').textContent+'   ·   B队 Team B: '+$('sb').textContent;
  const t=D.getElementById('t'); if(t){t.textContent='⏱ '+tleft;t.style.color=tleft<=10&&tleft>0?'#e53935':'#222';}
  if(!current){stage.innerHTML='<div class="wait">请主持出题  ·  Waiting for the next item</div>';return;}
  const m=mode();
  let h='';
  if(msg) h+='<div class="msg">'+esc(msg)+(ico==='⏰'?' ⏰':'')+'</div>';
  if(m==='guess'){
    h+=guessColsHTML(current, revealed);
    if(revealed){
      h+='<div class="ans">'+esc(current.w)+'<span class="party">'+ico+'</span></div>';
      h+='<div class="mean">'+esc(current.cn)+'</div>';
      h+='<div class="mean en">'+esc(current.en)+'</div>';
    }
  } else if(m==='add'){
    h+='<div class="eq">';
    current.parts.forEach((p,i)=>{if(i) h+='<span class="op">'+(current.op==='-'?'－':'＋')+'</span>'; h+='<span class="part">'+esc(p)+'</span>';});
    h+='<span class="op">＝</span>';
    h+='<span class="box" style="width:120px;height:130px;font-size:90px">'+(revealed?esc(current.ans):'')+'</span>';
    h+='</div>';
    if(revealed){
      h+='<div class="ans">'+esc(current.ans)+'　<span class="py" style="font-size:44px">'+esc(current.py)+'</span><span class="party">'+ico+'</span></div>';
      h+='<div class="mean">'+esc(current.cn)+'</div>';
      h+='<div class="mean en">'+esc(current.en)+'</div>';
    }
  } else if(m==='poem'){
    h+='<div class="meta">《'+esc(current.title)+'》　'+esc(current.author)+'</div>';
    current.lines.forEach(line=>{
      const parts=line.split('§');
      let row='<div class="line">';
      parts.forEach((part,i)=>{
        row+=esc(part);
        if(i<parts.length-1){
          row+=[...current.ans].map(ch=>'<span class="box">'+(revealed?esc(ch):'')+'</span>').join('');
        }
      });
      row+='</div>';
      h+=row;
    });
    if(revealed){
      h+='<div class="ans">'+esc(current.ans)+'<span class="party">'+ico+'</span></div>';
      h+='<div class="py">'+esc(current.py)+'</div>';
      h+='<div class="mean">'+esc(current.cn)+'</div>';
      h+='<div class="mean en">'+esc(current.en)+'</div>';
    }
  } else if(m==='riddle'){
    h+='<div class="rid">'+esc(current.riddle)+'</div>';
    h+=boxesHTML(current.ans, revealed);
    if(revealed){
      h+='<div class="ans">'+esc(current.ans)+'　<span class="py" style="font-size:44px">'+esc(current.py)+'</span><span class="party">'+ico+'</span></div>';
      h+='<div class="why">'+esc(current.why)+'</div>';
      h+='<div class="mean">'+esc(current.cn)+'  ·  '+esc(current.en)+'</div>';
    }
  } else if(m==='chain'){
    const chars=[...current.w];
    h+='<div class="cword">'+chars.map((ch,i)=>i===chars.length-1?'<span class="last">'+esc(ch)+'</span>':esc(ch)).join('')+'</div>';
    const lp=lastSyl(current.py)||charPy(chars[chars.length-1]);
    const fullpy=current.py?esc(current.py):'';
    h+='<div class="py">'+fullpy+'</div>';
    h+='<div class="lastpy">末字 last character：<b>'+esc(chars[chars.length-1])+'</b>　'+esc(lp)+'</div>';
    h+='<div class="note2">同音字也可以  ·  Homophones OK</div>';
    h+='<div class="len">接龙长度 Chain length：'+chainLen+'</div>';
    if(chainHint) h+='<div class="hintbox">💡 提示 Hint：'+esc(chainHint.w)+'　'+esc(chainHint.py||'')+'</div>';
  }
  stage.innerHTML=h;
}

}
