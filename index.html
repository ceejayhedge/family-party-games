:"心不在焉；做白日梦"},{"layout":"words","parts":["EYE","     ","EYE"],"ans":"seeing eye to eye","cn":"看法一致"},{"layout":"split","parts":["BAN","ANA"],"ans":"banana split","cn":"香蕉船"},{"layout":"stack","lines":["OVER","SEAS"],"ans":"overseas","cn":"海外"},{"layout":"high","word":"SECRET","ans":"top secret","cn":"绝密"},{"layout":"low","word":"LINE","ans":"bottom line","cn":"底线；最要紧的一点"},{"layout":"high","word":"SCHOOL","ans":"high school","cn":"高中"},{"layout":"tilt","word":"STAR","ans":"falling star","cn":"流星"},{"layout":"under","top":"BELT","bottom":"HIT","ans":"hit below the belt","cn":"用不正当手段"},{"layout":"repeat","word":"CROSS","n":2,"ans":"double-cross","cn":"出卖；欺骗"}],"3":[{"layout":"mirror","word":"LOOKING","ans":"looking back","cn":"回望；向后看"},{"layout":"between_words","left":"ROCK","right":"HARD PLACE","ans":"between a rock and a hard place","cn":"左右为难"},{"layout":"words","parts":["MISS","TAKE"],"ans":"mistake","cn":"错误（miss-take）"},{"layout":"middle_word","outer":"EVERYTHING","inner":"RIGHT","ans":"right in the middle of everything","cn":"恰好在一切的中间"},{"layout":"scramble","letters":["F","E","E","L","I","N","G","S"],"ans":"mixed feelings","cn":"心情复杂"},{"layout":"needle","ans":"a needle in a haystack","cn":"大海捞针"},{"layout":"snake_grass","ans":"a snake in the grass","cn":"潜伏的危险"},{"layout":"words","parts":["CHANGE","❤️"],"ans":"a change of heart","cn":"改变心意"},{"layout":"around_clock","ans":"around the clock","cn":"夜以继日；全天候"},{"layout":"backback","ans":"back to back","cn":"背对背"},{"layout":"scattered","word":"THE PLACE","prefix":"ALL","ans":"all over the place","cn":"到处都是；杂乱无章"},{"layout":"words","parts":["NEXT","NOTHING"],"ans":"next to nothing","cn":"几乎没有"},{"layout":"out_bounds","ans":"out of bounds","cn":"出界"},{"layout":"stack","lines":["TIME","TIME"],"ans":"time after time","cn":"一次又一次"},{"layout":"words","parts":["HEAD","HEAD"],"sub":"better than one","ans":"two heads are better than one","cn":"三个臭皮匠，胜过诸葛亮"},{"layout":"wall","word":"THE WRITING","ans":"the writing on the wall","cn":"不祥的预兆"},{"layout":"tiny","word":"ME","prefix":"PARDON","ans":"pardon me","cn":"对不起；请原谅"},{"layout":"away","word":"STOW","ans":"stowaway","cn":"偷渡者；偷乘者"},{"layout":"words","parts":["CHEAP","SKATES"],"ans":"cheapskates","cn":"小气鬼"},{"layout":"words","parts":["BREAD","&","BUTTER"],"ans":"bread and butter","cn":"饭碗；主要收入来源"},{"layout":"hole_in_one","ans":"a hole in one","cn":"一杆进洞"},{"layout":"words","parts":["ONCE","BITTEN"],"sub":"TWICE SHY","ans":"once bitten, twice shy","cn":"一朝被蛇咬，十年怕井绳"},{"layout":"i_unionized","ans":"I in unionized  (un-ionized)","cn":"单词 unionized 里有一个 I；也可读成 un-ionized"},{"layout":"every_then","ans":"every now and then","cn":"时不时"}]},"logic":{"1":[{"q":"A farmer has 17 sheep. All but 9 of them run away. How many sheep are left?","qcn":"农夫有 17 只羊，除了 9 只以外都跑掉了。还剩几只羊？","a":"9","why":"“All but 9” means 9 stay. 「除了 9 只」= 还剩 9 只。"},{"q":"A rooster is sitting on the roof of a barn. How many eggs can it lay?","qcn":"一只公鸡坐在谷仓屋顶上。它能下几只蛋？","a":"Zero — roosters don’t lay eggs.","why":"公鸡不会下蛋。"},{"q":"Two coins add up to 30 cents. One of them is not a nickel (5 cents). What are the two coins?","qcn":"两枚硬币加起来是 30 分。其中一枚不是 5 分的镍币。这两枚是什么？","a":"A quarter (25¢) and a nickel (5¢).","why":"The other coin is the nickel. 另外那一枚才是 5 分币。"},{"q":"Ali is taller than Ben. Cara is shorter than Ben. Who is the tallest?","qcn":"Ali 比 Ben 高。Cara 比 Ben 矮。谁最高？","a":"Ali","why":"Ali > Ben > Cara."},{"q":"What comes next: 2, 4, 8, 16, ?","qcn":"下一个数字是什么：2, 4, 8, 16, ?","a":"32","why":"Each number is multiplied by 2. 每次乘以 2。"},{"q":"A bicycle has 2 wheels and a tricycle has 3. How many wheels do 2 bicycles and 3 tricycles have in total?","qcn":"一辆自行车有 2 个轮，一辆三轮车有 3 个轮。2 辆自行车和 3 辆三轮车一共几个轮？","a":"13","why":"2×2 + 3×3 = 4 + 9 = 13."},{"q":"Which is heavier: 1 kilogram of feathers or 1 kilogram of stones?","qcn":"哪一个更重：1 公斤羽毛，还是 1 公斤石头？","a":"They weigh the same.","why":"Both are 1 kg. 都是 1 公斤。"},{"q":"If yesterday was Thursday, what day is tomorrow?","qcn":"如果昨天是星期四，明天是星期几？","a":"Saturday","why":"Yesterday Thursday → today Friday → tomorrow Saturday."},{"q":"4 people meet and everyone shakes hands with everyone else once. How many handshakes is that?","qcn":"4 个人见面，每两个人都握一次手。一共握几次？","a":"6","why":"1+2+3 = 6, or 4×3/2 = 6."},{"q":"A clock shows 3:00. What is the angle between the hour hand and the minute hand?","qcn":"时钟指向 3:00。时针和分针的夹角是多少度？","a":"90 degrees","why":"At 3:00 they form a right angle. 正好直角。"},{"q":"There are 6 flowers. 2 of them are not roses. The rest are roses. How many roses are there?","qcn":"有 6 朵花，其中 2 朵不是玫瑰，其余都是。有几朵玫瑰？","a":"4","why":"6 − 2 = 4."},{"q":"A bus starts empty. 8 people get on, 3 get off, 5 get on, 2 get off. How many people are on the bus now?","qcn":"空车出发。上来 8 人，下去 3 人，上来 5 人，下去 2 人。车上现在有几人？","a":"8","why":"8 − 3 + 5 − 2 = 8."},{"q":"Amy, Ben and Cara sit in a row. Amy is not at either end. Ben sits to the left of Amy. Who sits where (left to right)?","qcn":"Amy、Ben、Cara 坐成一排。Amy 不在两头。Ben 在 Amy 左边。从左到右谁坐哪里？","a":"Ben, Amy, Cara","why":"Amy is in the middle; Ben on her left, so Cara on the right."},{"q":"I’m thinking of a number. It is even, greater than 10, less than 20, and a multiple of both 4 and 3. What is it?","qcn":"我想了一个数：是偶数，大于 10，小于 20，而且既是 4 的倍数也是 3 的倍数。是几？","a":"12","why":"Between 10 and 20, only 12 is a multiple of both 3 and 4. 18 is not a multiple of 4."},{"q":"3 cats catch 3 mice in 3 minutes. How many minutes do 9 cats need to catch 9 mice (same speed)?","qcn":"3 只猫 3 分钟抓 3 只老鼠。按同样速度，9 只猫抓 9 只老鼠要几分钟？","a":"3 minutes","why":"Each cat catches 1 mouse in 3 minutes, so 9 cats catch 9 mice in 3 minutes too."},{"q":"A family has a mum, a dad, 4 daughters, and each daughter has exactly one brother. How many children are there?","qcn":"一家有妈妈、爸爸、4 个女儿，而且每个女儿都只有一个弟弟。家里一共几个孩子？","a":"5 children (4 girls and 1 boy).","why":"四个女儿共用同一个弟弟。"},{"q":"In a dark drawer there are red, blue and yellow socks, lots of each. How many socks must you pick to be sure you have a matching pair?","qcn":"黑暗的抽屉里有红、蓝、黄三种袜子，每种都很多。要保证有一双相同颜色，至少要拿几只？","a":"4","why":"The first 3 could all be different colours; the 4th must match one of them."},{"q":"A water lily doubles in size every day. It covers the whole pond on day 20. On which day is the pond half covered?","qcn":"睡莲每天长大一倍，第 20 天铺满整个池塘。哪一天铺满一半？","a":"Day 19","why":"The day before it doubles to full is half. 满的前一天就是一半。"},{"q":"Monday is day 1, Wednesday is day 3, Friday is day 5. What number is Sunday?","qcn":"星期一是第 1 天，星期三是第 3 天，星期五是第 5 天。星期天是第几天？","a":"7","why":"Sunday is the 7th day of the week."},{"q":"There are 3 houses in a line. The red house is not at the back. The green one is in front of the red one. The blue one is not in front. What is the order from front to back?","qcn":"三座房子排成一列。红房子不在最后。绿房子在红房子前面。蓝房子不在最前。从前到后是什么顺序？","a":"Green, red, blue.","why":"Green is in front of red; blue must be at the back."},{"q":"What comes next in this pattern of shapes: ▲ ▲ ■  ▲ ▲ ■  ▲ ?","qcn":"这个图形规律的下一个是什么：▲ ▲ ■  ▲ ▲ ■  ▲ ?","a":"▲, then ■","why":"Groups of two triangles then a square. 两个三角形再一个正方形，循环。"},{"q":"A baker bakes 4 trays of 6 buns, then gives 5 buns to a friend and keeps the rest in boxes of 3. How many boxes does he fill?","qcn":"面包师傅烤了 4 盘，每盘 6 个包。送给朋友 5 个，剩下的每 3 个装一盒。能装满几盒？","a":"6 boxes, with 1 bun left over.","why":"4×6=24, 24−5=19, 19=6×3 + 1."},{"q":"I have twice as many sisters as brothers. My sister has as many sisters as brothers. How many girls and boys are in the family (children only)?","qcn":"我说：我的姐妹人数是兄弟的两倍。我的一个姐妹说：我的姐妹和兄弟一样多。家里有几个女孩、几个男孩？","a":"4 girls and 3 boys.","why":"From a boy: G=2(B−1). From a girl: G−1=B. So 2(B−1)−1=B → B=3, G=4."},{"q":"A boy and his dad visit the hospital. A doctor looks at the boy and says, “I can’t treat him — he is my son.” The dad is standing right there. How is that possible?","qcn":"男孩和爸爸去医院。一位医生看着男孩说：“我不能给他看病，他是我儿子。”爸爸就站在旁边。这怎么可能？","a":"The doctor is the boy’s mum.","why":"医生是男孩的妈妈。"}],"2":[{"q":"Three boxes. One has apples, one has oranges, one has apples and oranges. Every label is wrong. You take one fruit from the box labelled “apples & oranges”. It is an apple. What is in each box?","qcn":"三个箱子：一箱苹果、一箱橙子、一箱两种都有。每张标签都是错的。你从标着「苹果和橙子」的箱子里拿出一个，是苹果。各箱里是什么？","a":"“Apples & oranges” = only apples. “Apples” = only oranges. “Oranges” = apples and oranges.","why":"The mixed label is wrong, and you drew an apple, so that box is only apples. “Apples” cannot be apples, so it is oranges. The last box is mixed."},{"q":"Five friends sit in a row: A, B, C, D, E. C sits at one end. A sits next to D. B is not next to C. E sits between A and C. If C is at the left end, who sits where from left to right?","qcn":"五位朋友坐一排：A B C D E。C 在其中一端。A 紧挨着 D。B 不挨着 C。E 坐在 A 和 C 中间。若 C 在左端，从左到右是谁？","a":"C, E, A, D, B","why":"C at an end. E between A and C, so C–E–A. A next to D, so C–E–A–D. B is not next to C, so B is at the other end: C E A D B."},{"q":"A, B and C are a painter, a baker and a teacher (one each). A is not the teacher. B has never held a paintbrush. The baker is C’s sister. Who does which job?","qcn":"A、B、C 分别是画家、面包师和老师。A 不是老师。B 从来没拿过画笔。面包师是 C 的姐姐。谁做什么工作？","a":"A baker, B teacher, C painter.","why":"The baker is C’s sister, so the baker is not C. B is not the painter. A is not the teacher. So A is baker, B teacher, C painter."},{"q":"A 3-digit palindrome ABA (first digit equals last). The digits sum to 18, and the middle digit is even and not zero. What is the largest such number?","qcn":"一个三位数回文数 ABA（首位等于末位），各位之和为 18，中间位是不为零的偶数。最大的这样的数是？","a":"828","why":"2A+B=18, B even 2–8. Largest A then B: A=8, B=2 → 828. (A=9 would need B=0, which is not allowed.)"},{"q":"Three children wear red or blue hats. They know there is at least one red hat. Anna can see the other two hats, and both are blue. What colour is Anna’s hat?","qcn":"三个孩子戴红或蓝帽子，他们知道至少有一顶红帽子。安娜看见另外两人都是蓝帽子。安娜自己的帽子是什么颜色？","a":"Red","why":"If Anna saw two blue hats, and there is at least one red, her own hat must be red."},{"q":"A snail climbs a 10-metre well. It climbs 3 m each day and slips 2 m each night. After how many days does it get out?","qcn":"蜗牛爬 10 米深的井，白天爬 3 米，夜里滑 2 米。第几天能爬出去？","a":"8 days","why":"Net 1 m per full day, so after 7 days it is at 7 m. On day 8 it climbs 3 m to 10 m and is out before night."},{"q":"In a 3×3 grid the numbers 1 to 9 are placed, one per cell, so that each row, column and both long diagonals add to 15. The centre cell is 5 and a corner is 2. What number is in the opposite corner?","qcn":"3×3 幻方，每行、每列、两条对角线之和都是 15。中心是 5，一个角是 2。对角的那个角是几？","a":"8","why":"Opposite corners plus the centre 5 add to 15, so the opposite corner is 8."},{"q":"Four cards sit in a line. There is a queen somewhere to the left of a king. There is a king somewhere to the left of a jack. There is a jack somewhere to the left of a queen. There are two queens. The rightmost card is not a king. What is the row of four cards?","qcn":"四张牌排成一排。有一张 Q 在某张 K 左边；有一张 K 在某张 J 左边；有一张 J 在某张 Q 左边。一共两张 Q。最右边不是 K。四张牌从左到右是什么？","a":"Q K J Q","why":"Q–K–J–Q satisfies every “somewhere to the left” clue, and the rightmost card is a queen. Other orders with two queens fail at least one clue."},{"q":"Mina, Noah and Priya each like a different fruit: apple, banana or cherry, and a different colour: red, yellow or green. Mina does not like yellow. Noah’s fruit is yellow (banana). Priya does not like apple, and she does not like red. Who likes which fruit and colour?","qcn":"Mina、Noah、Priya 各喜欢一种水果（苹果、香蕉、樱桃）和一种颜色（红、黄、绿），都不重复。Mina 不喜欢黄。Noah 喜欢的水果是黄色的香蕉。Priya 不喜欢苹果，也不喜欢红。谁喜欢什么？","a":"Noah: yellow banana. Priya: green cherry. Mina: red apple.","why":"Noah takes yellow and banana. Priya is not apple and not red, so she gets green cherry. Mina gets red apple."},{"q":"A shop sells pencils in packs of 6 or 11. What is the largest number of pencils you cannot buy exactly?","qcn":"商店的铅笔有 6 支装和 11 支装。你没法刚好买到的最大支数是多少？","a":"49","why":"The Frobenius number for 6 and 11 is 6×11 − 6 − 11 = 49."},{"q":"Three light switches downstairs, three bulbs upstairs, each switch to one bulb. You may go upstairs only once. How do you find out which switch belongs to which bulb? (Bulbs start off, and they get warm when they have been on.)","qcn":"楼下 3 个开关，楼上 3 盏灯，一对一。你只能上楼一次。怎样知道每个开关控制哪盏灯？（灯亮过会发热。）","a":"Turn switch 1 on for a few minutes, then turn it off. Turn switch 2 on, leave switch 3 off. Go upstairs: the lit bulb is switch 2; the dark but warm bulb is switch 1; the dark cold bulb is switch 3.","why":"用发热来区分「曾经亮过」的那盏。"},{"q":"A river crossing: a farmer has a wolf, a goat and a cabbage. The boat holds the farmer and only one other thing. The wolf cannot be left alone with the goat, and the goat cannot be left alone with the cabbage. How does the farmer get everything across? List the trips.","qcn":"农夫要带狼、羊、白菜过河。船只能再载一样。狼不能和羊单独留下，羊不能和白菜单独留下。怎样过河？","a":"Take the goat across, return alone. Take the wolf (or cabbage) across, return with the goat. Take the cabbage (or wolf) across, return alone. Take the goat across.","why":"关键：把羊先送过去，第二次把狼或菜送过去时要把羊带回来。"},{"q":"In a race, you overtake the person in 2nd place. What place are you in now?","qcn":"赛跑时，你超过了第二名。你现在是第几名？","a":"2nd place","why":"Overtaking 2nd puts you in 2nd, not 1st. 超过第二名就变成第二名。"},{"q":"A rectangle is 3 times as long as it is wide. The perimeter is 48 cm. What is the area?","qcn":"一个长方形的长是宽的 3 倍，周长 48 厘米。面积是多少？","a":"108 cm²","why":"2(3w+w)=48, 8w=48, w=6, length=18, area=108."},{"q":"The sum of three consecutive whole numbers is 48. What are the numbers?","qcn":"三个连续整数的和是 48。这三个数是？","a":"15, 16, 17","why":"n+(n+1)+(n+2)=48, 3n+3=48, 3n=45, n=15."},{"q":"There are 9 coins, one of which is lighter, and a balance scale. How do you find the light coin in two weighings?","qcn":"9 枚硬币，有 1 枚较轻。用天平两次，怎样找出轻的那枚？","a":"Weigh 3 vs 3. The lighter group of 3 (or the 3 left out if they balance) contains the light coin. Then weigh 2 of those 3: the lighter is the answer, or the leftover if they balance.","why":"每次分成三组，称其中两组。"},{"q":"A clock loses 3 minutes every hour. It is set correctly at 12:00 noon. What time will it show when the real time is 8:00 pm the same day?","qcn":"一座钟每小时慢 3 分钟。中午 12 点对好。到真正晚上 8 点时，钟面上是几点？","a":"7:36 pm","why":"From noon to 8 pm is 8 real hours. The clock ticks 57 minutes per real hour, so it advances 8×57=456 minutes = 7 hours 36 minutes."},{"q":"21 animals, some chickens and some cows, have 56 legs in total. How many chickens and how many cows?","qcn":"21 只动物，有鸡有牛，一共 56 条腿。几只鸡、几只牛？","a":"14 chickens and 7 cows.","why":"Let c be cows. 4c+2(21−c)=56, 2c+42=56, 2c=14, c=7, chickens=14."},{"q":"You have two jugs of 3 litres and 5 litres, and a lake. How do you measure exactly 4 litres in the 5-litre jug?","qcn":"有 3 升和 5 升的水壶，还有湖水。怎样在 5 升壶里刚好量出 4 升？","a":"Fill the 5. Pour into the 3 until the 3 is full (2 left in the 5). Empty the 3. Pour the 2 into the 3. Fill the 5 again. Pour into the 3, which already has 2 and only needs 1 more: 4 litres remain in the 5.","why":"5→3，剩 2；2 倒进 3；再装满 5，向 3 补 1 升，5 升壶里剩下 4 升。"},{"q":"What is the next number: 1, 11, 21, 1211, 111221, ?","qcn":"下一个数是什么：1, 11, 21, 1211, 111221, ?","a":"312211","why":"Look-and-say: one 1; two 1s; one 2 one 1; one 1 one 2 two 1s; then three 1s, two 2s, one 1 → 312211."}],"3":[{"q":"Four people need to cross a bridge at night with one torch. They take 1, 2, 5 and 10 minutes. At most two cross at a time, and they must have the torch. The pair walks at the slower person’s speed. The torch must be brought back (except at the end). What is the shortest total time?","qcn":"四人过桥，时间分别 1、2、5、10 分钟。一次最多两人，必须带唯一的手电筒，两人速度按较慢的算。最短需要多少分钟？","a":"17 minutes","why":"1+2 cross (2), 1 back (1), 5+10 cross (10), 2 back (2), 1+2 cross (2). Total 17. The other common plan takes 19."},{"q":"A man looks at a portrait and says: “Brothers and sisters I have none, but that man’s father is my father’s son.” Who is in the portrait?","qcn":"一个人看着一幅画像说：“我没有兄弟姐妹，但那个人的父亲是我父亲的儿子。”画像里是谁？","a":"His son.","why":"“My father’s son” is himself (he has no siblings). So “that man’s father is me” — the portrait is his son."},{"q":"There are 12 coins, one of which is counterfeit and may be heavier or lighter. You have a balance scale. How many weighings are needed at most, and why is that number enough in theory?","qcn":"12 枚硬币，有 1 枚是假的，可能更重也可能更轻。用天平，理论上最少几次一定能找出假币并知道偏轻还是偏重？","a":"3 weighings.","why":"Each weighing has 3 outcomes. 3 weighings give 27 paths. There are 12×2=24 cases to distinguish, and 27>24, so 3 is enough; 2 weighings give only 9 < 24."},{"q":"In a village, people either always tell the truth or always lie. You meet A and B. A says: “B and I are both liars.” What are A and B?","qcn":"村里的人要么永远说实话，要么永远说谎。你遇见 A 和 B。A 说：“B 和我都是骗子。”A 和 B 分别是什么人？","a":"A is a liar, B is a truth-teller.","why":"A cannot be a truth-teller, or “we are both liars” would be true, which is impossible. So A is a liar, and they are not both liars: B tells the truth."},{"q":"A 4-digit palindrome ABBA has digit sum 16. What is the largest such number?","qcn":"一个四位回文数 ABBA，各位数字之和为 16。最大的这样的数是？","a":"8008","why":"2A+2B=16 so A+B=8. Largest A is 8, with B=0, giving 8008."},{"q":"Three people A, B and C wear hats drawn from a pool of 3 white and 2 black hats (two hats unused). A sees B and C; B sees C; C sees no one. A says “I don’t know my hat.” B says “I don’t know mine either.” C then says “Then mine is white.” Why can C be sure, and what colour is C wearing?","qcn":"五顶帽子里有 3 白 2 黑，三人各戴一顶。A 能看见 B 和 C，B 能看见 C。A 说“我不知道自己的”。B 说“我也不知道”。C 说“那我的是白的”。C 为什么能确定？","a":"White. If B and C were both black, A would have seen two black hats and would know his own was white (only 2 black exist). A doesn’t know, so B and C are not both black. If B saw a black hat on C, B would then know his own could not be black (or A would have known), so B would deduce white. B doesn’t know, therefore C is not black. So C is white.","why":"从「A 不知道」推出 B、C 不是两黑；再从「B 也不知道」推出 C 不是黑，故 C 是白。"},{"q":"A square garden has a square fountain in the centre, sides parallel. The garden’s side is 10 m and the path around the fountain (the area between the two squares) is 36 m². What is the side of the fountain?","qcn":"边长 10 米的正方形花园，正中有一个边平行的正方形喷泉。喷泉四周一圈空地面积 36 平方米。喷泉边长是多少？","a":"8 m","why":"10² − s² = 36, 100−36=64, s=8."},{"q":"Find all 3-digit numbers (no zero digits) that are equal to 4 times the product of their digits. What numbers work?","qcn":"找所有各位数字都不为 0、且等于其各位数字之积的 4 倍的三位数。有哪些？","a":"384","why":"Check by 100a+10b+c = 4abc, with a,b,c from 1 to 9."},{"q":"Using each of the digits 1–9 exactly once, form three 3-digit numbers that add up to 1089. Give one solution.","qcn":"用 1 到 9 每个一次，组成三个三位数，使它们的和是 1089。写出一组即可。","a":"124 + 367 + 598 = 1089","why":"One verified arrangement of the digits 1–9."},{"q":"On a 24-hour digital clock showing hours:minutes (4 digits), how many palindrome times are there from 00:00 to 23:59? Name one in the afternoon.","qcn":"数字时钟显示小时:分钟四位。从 00:00 到 23:59，有多少个回文时刻？并举一个下午的例子。","a":"16 times. Afternoon example: 13:31. The times are 00:00, 01:10, 02:20, 03:30, 04:40, 05:50, 10:01, 11:11, 12:21, 13:31, 14:41, 15:51, 20:02, 21:12, 22:22, 23:32.","why":"The form is AB:BA, so hours AB (00–23) and minutes 10×B+A must be 00–59, hence B=0–5."},{"q":"A number leaves a remainder of 1 when divided by 2, 3, 4, 5 or 6, but is divisible by 7. What is the smallest positive such number?","qcn":"一个数除以 2、3、4、5、6 都余 1，但能被 7 整除。最小的正数是？","a":"301","why":"The number is 1+60k, and 1+60k is divisible by 7. 60≡4 (mod 7), so 1+4k≡0 (mod 7), 4k≡6, k≡5 (mod 7). Smallest positive: k=5, n=301."},{"q":"A 5×5 magic square uses 1 through 25, each once, and every row, column and both main diagonals sum to 65. What must the centre cell be?","qcn":"5×5 幻方用 1 到 25 各一次，每行、每列、两条主对角线之和都是 65。中心格子一定是几？","a":"13","why":"The centre of an odd-order magic square is the middle value, (1+25)/2=13."},{"q":"There are 100 lockers, all starting closed, and 100 students. Student k toggles every k-th locker. Which lockers are open at the end, and how many?","qcn":"100 个柜门开始都关着，100 个学生。第 k 个学生改变每个第 k 个柜子的开关。最后哪些柜子是开的？共几扇？","a":"The perfect squares: 1, 4, 9, 16, 25, 36, 49, 64, 81, 100 — 10 lockers.","why":"Locker n is toggled once for each divisor. Only squares have an odd number of divisors."},{"q":"A goat is tied to the corner of a square barn, side 10 m, with a rope of 10 m, on the outside. It cannot go into the barn. What area of grass can it eat? Leave the answer in terms of π.","qcn":"一只羊拴在边长 10 米的正方形谷仓的墙角，绳子长 10 米，在谷仓外面，进不了谷仓。它能吃到多大面积的草？用 π 表示。","a":"75π m²","why":"It can graze a three-quarter circle of radius 10: (3/4)×π×10² = 75π."},{"q":"In the classic cryptarithm SEND + MORE = MONEY, each letter stands for a different digit. What five-digit number is MONEY?","qcn":"著名字母算式 SEND + MORE = MONEY，每个字母代表不同的数字。MONEY 代表哪个五位数？","a":"10652  (SEND=9567, MORE=1085, MONEY=10652).","why":"M must be 1 (a carry). The unique solution is 9567+1085=10652."},{"q":"A 2-pan balance and weights that may be placed on both pans (so a weight can be with the object, against it, or unused). You want to weigh any integer number of kilograms from 1 to 13. What is the smallest set of weights?","qcn":"天平两边都可以放砝码（砝码可与物体同侧、对侧，或不用）。要称 1 到 13 的任意整千克，最少用哪些砝码？","a":"1 kg, 3 kg, and 9 kg.","why":"Powers of 3: each weight is ternary (−1, 0, +1). 1+3+9=13."},{"q":"Twelve 1-metre sticks form a 2×2 window of four unit squares. What is the smallest number of sticks you can remove so that no complete unit square remains? (The large outer square may remain.)","qcn":"12 根小棒搭成四个小方格的窗。最少拿走几根，使任何一个 1×1 小方格都不完整？（外面的大方格可以还在。）","a":"2","why":"Remove both mid-horizontal segments (or both mid-vertical). Each of the four small squares loses one side."},{"q":"A caterpillar is at one corner of a 3 m × 4 m × 5 m room and must crawl on the surfaces to the opposite corner. What is the shortest path?","qcn":"毛毛虫在 3×4×5 米房间的一个墙角，只能沿墙面爬到最远的对角。最短路径是多少？","a":"√74 m  (about 8.60 m)","why":"Unfold the room into a net and go in a straight line. The three ways give √((3+4)²+5²)=√74, √((3+5)²+4²)=√80, √((4+5)²+3²)=√90. The shortest is √74."},{"q":"A farmer sells 100 animals for $100. Cows are $10, pigs $3, and chicks $0.50 each. He sells at least one of each. How many of each does he sell?","qcn":"农夫卖了 100 只动物，正好 100 元。牛 10 元，猪 3 元，小鸡 0.50 元，每种至少一只。各几只？","a":"5 cows, 1 pig, 94 chicks.","why":"If c cows and p pigs: 19c+5p=100. Only solution with c≥1, p≥1 is c=5, p=1, chicks=94. Check: 5+1+94=100 animals, 50+3+47=100 dollars."},{"q":"Five positive integers have an average of 10 (so they sum to 50). The median is 8, and the unique mode is 6. What is the largest possible value of the largest number?","qcn":"五个正整数平均是 10（总和 50），中位数是 8，唯一的众数是 6。最大的那个数最大可以是多少？","a":"21","why":"The ordered list must be 6, 6, 8, a, b with a+b=30, 9≤a<b (so 6 is the unique mode and 8 is the median). The maximum b is when a=9: 21."}]},"mystery":{"1":[{"story":"A man walks into a café and asks for a glass of water. Instead, the waiter shouts “Boo!” The man says “Thank you!” and leaves, looking happy. Why?","storycn":"一位男士走进咖啡店，要一杯水。服务员却对他大喊“哇！”男士说“谢谢！”然后高兴地走了。为什么？","a":"He had hiccups. The shock cured them, so he didn’t need the water.","acn":"他在打嗝，被吓了一跳就不打了，也就不用喝水了。"},{"story":"Two children were born on the same day of the same year, to the same parents, and they look very much alike — but they are not twins. How?","storycn":"两个孩子在同一年的同一天出生，父母也相同，长得很像，但他们不是双胞胎。怎么回事？","a":"They are two of a set of triplets (or more).","acn":"他们是三胞胎（或更多胞胎）里的两个。"},{"story":"A man pushes his car until he reaches a hotel. He then says, “I’m bankrupt!” What is going on?","storycn":"一个人把一辆车推到一家旅馆前，然后说：“我破产了！”这是怎么回事？","a":"He is playing Monopoly (or another board game). The “car” is a game piece, and he landed on a hotel he cannot pay for.","acn":"他在玩大富翁。那辆“车”是棋子，他走到了付不起的旅馆。"},{"story":"A girl lives on the 15th floor. Every day she takes the lift to the 10th floor and walks the rest of the way up. On rainy days, she rides the lift all the way to the 15th floor. Why?","storycn":"女孩住在 15 楼。每天她乘电梯只到 10 楼，再走上去。下雨天，她会乘电梯一直到 15 楼。为什么？","a":"She is a child and can only reach the button for the 10th floor. On rainy days she has an umbrella, so she can press 15.","acn":"她个子小，平时够不到 15 楼的按钮。下雨天有雨伞，就可以按到了。"},{"story":"A man rides into a village on Friday, stays for three days, and rides out on Friday. How can that be?","storycn":"有一个人骑着马在 Friday 进村，住了三天，又在 Friday 出村。这怎么可能？","a":"Friday is the name of his horse.","acn":"Friday 是他那匹马的名字。"},{"story":"Five people are standing under one small umbrella, but nobody gets wet. How?","storycn":"五个人站在一把小小的雨伞下面，但没有人淋湿。怎么回事？","a":"It isn’t raining.","acn":"当时没有下雨。"},{"story":"A man is driving down a country road. The street lights are off, the car’s headlights are off, and there is no moon. A black cat steps into the middle of the road — yet he swerves in time and doesn’t hit it. How did he see the cat?","storycn":"一个人在乡间路上开车，路灯关了，车灯也关了，没有月亮。一只黑猫走到路中间，他却及时躲开了。他怎么看见的？","a":"It was daytime. The story never said it was actually dark — only that the lights were off.","acn":"那是白天。故事只说灯关了，没说一定是天黑。"},{"story":"A painter is on a 10-metre ladder, painting a wall. He falls off the ladder, but is not hurt at all. Why?","storycn":"油漆工站在 10 米高的梯子上刷墙，从梯子上摔了下来，却一点也没受伤。为什么？","a":"He fell from the bottom rung (or the first step) — he was only one step up.","acn":"他是从最低的一格踩空摔下来的，离地只有一点点。"},{"story":"In the morning, the white figure who had been standing quietly in the garden all night was gone, and there was just a wet patch on the grass. What happened?","storycn":"早上，夜里一直静静站在花园里的那个白衣身影不见了，草地上只留下一块湿痕。发生了什么？","a":"It was a snowman, and the weather turned warmer, so it melted.","acn":"那是一个雪人，天气变暖就化了。"},{"story":"A truck is stuck under a low bridge and cannot go forward or back. A child walking by suggests one simple idea, and it works. What did the child say?","storycn":"一辆卡车卡在矮桥下面，进退不得。一个路过的孩子出了一个简单的主意，结果成功了。孩子说了什么？","a":"Let a little air out of the tyres, so the truck sits lower and can pass under the bridge.","acn":"把轮胎的气放掉一点，车身就会低一些，就能从桥下过去。"},{"story":"A hunter walks 1 kilometre due south, 1 kilometre due east, and 1 kilometre due north, and is back at his tent. He sees a bear. What colour is the bear?","storycn":"猎人向南走 1 公里，向东走 1 公里，再向北走 1 公里，正好回到帐篷。他看见一头熊。熊是什么颜色？","a":"White. He is at the North Pole, so the bear is a polar bear.","acn":"白色。他在北极，那是北极熊。"},{"story":"A woman is sitting in a house where every window faces south. A bear walks past the window. What colour is the bear?","storycn":"一位女士坐在一栋房子里，每个窗户都朝南。窗外走过一只熊。熊是什么颜色？","a":"White — the house is at the North Pole, so every window can face south.","acn":"白色。房子在北极点上，四面的窗都可以朝南。北极熊。"},{"story":"A person sits in a room with no lights, no candles, and no fire, reading a book. The window is tightly shuttered. How can they read?","storycn":"一个人坐在没有灯、没有蜡烛、也没有火的房间里读书。窗户关得严严的。他怎么读呢？","a":"The book is in Braille. They are reading with their fingers.","acn":"那是一本盲文书，用手摸着读。"},{"story":"A man leaves home, makes three left turns, and comes back to find two people wearing masks standing there. What is happening?","storycn":"一个人离开家，连转三个左转，回来时看见两个人戴着面罩站在那里。这是在做什么？","a":"He is a baseball player running the bases. The two people in masks are the catcher and the umpire.","acn":"他在打棒球，绕着垒跑。戴面罩的是捕手和裁判。"},{"story":"There is a barrel, not completely full to the brim, with no lid. You cannot put any liquid into it, and nothing is stuck in the opening. Why not?","storycn":"有一只桶，没有盖，也没有满到最顶，但你没法再往里面装任何液体。为什么？","a":"It is a sieve (or colander) — it is full of holes, so it cannot hold liquid.","acn":"那是一只筛子，到处是洞，装不住液体。"},{"story":"Two children are playing with a small boat in the middle of a “lake.” The boat slowly fills with water and sinks. The children are perfectly fine and dry. How?","storycn":"两个孩子在“湖”中间玩一条小船。船慢慢进水沉了，可两个孩子却好好的，身上也是干的。怎么回事？","a":"It is a toy boat in a paddling pool or basin. The children are standing beside the water, not sitting in the boat.","acn":"那是一只玩具小船，孩子站在浅水池或盆边，并没有坐在船上。"},{"story":"A boy brings a pet to school in a box with air holes. At show-and-tell he opens the box and it looks empty, but the teacher agrees he really did bring a pet. What happened?","storycn":"男孩用带孔的盒子把宠物带到学校。展示时打开盒子，看起来是空的，但老师同意他真的带了宠物。发生了什么？","a":"The pet was a bird or a small insect, and it flew (or crawled) out as soon as the box was opened. The teacher saw it.","acn":"那是一只小鸟或小虫，盒子一打开就飞走（或爬走）了，老师看见了。"},{"story":"A man walks into the bathroom, stays five minutes, and comes out looking like a different person — but he did not change his clothes. What happened?","storycn":"一个人走进洗手间，待了五分钟，出来时看起来像换了一个人，可他并没有换衣服。发生了什么？","a":"He shaved off his beard (or took off a party mask or wig).","acn":"他把胡子刮了（或摘掉了派对面具、假发）。"},{"story":"A customer asks the baker to write “Happy Birthday” on a cake, then walks out without taking the cake. The baker is not angry. Why?","storycn":"客人请师傅在蛋糕上写“生日快乐”，然后没有把蛋糕带走就走了。师傅也不生气。为什么？","a":"The customer already paid and will pick the cake up later.","acn":"客人已经付过钱，稍后再来取这个蛋糕。"},{"story":"You are the bus driver. You leave the depot with an empty bus. At the first stop 5 people get on. At the second stop 2 get off and 3 get on. After several more stops, you reach the last stop of the day. What is the driver’s name?","storycn":"你就是巴士司机。你把空车开出车场。第一站上来 5 人，第二站下去 2 人又上来 3 人……走到当天最后一站。请问司机叫什么名字？","a":"Your name — the first sentence said “You are the bus driver.”","acn":"就是你自己的名字。故事第一句说“你就是巴士司机”。"}],"2":[{"story":"A woman is looking at a photograph. A friend asks, “Who is that?” She answers: “Brothers and sisters I have none, but that man’s father is my father’s son.” Who is in the photograph?","storycn":"一位女士看着一张照片。朋友问：“这是谁？”她说：“我没有兄弟姐妹，但那个人的父亲是我父亲的儿子。”照片里是谁？","a":"Her son.","acn":"“我父亲的儿子”就是她自己（她没有兄弟姐妹），所以“那个人的父亲是我”，照片里是她的儿子。"},{"story":"A person is running home as fast as they can. A person in a mask is waiting at home, but they are not afraid — they are trying to get there. What’s going on?","storycn":"有一个人拼命往家跑。家里有一个戴面罩的人在等他，可他并不害怕，还想尽快到家。这是在做什么？","a":"It is a baseball game: he is running for home plate, and the catcher (in a mask) is waiting to tag him.","acn":"这是棒球比赛：他在跑回本垒，戴面罩的是捕手。"},{"story":"A waiter brings two cups of coffee. The first customer adds sugar, but is called away. When she comes back she drinks the other cup, which she did not sweeten — and it is already sweet. No one swapped the cups, and nothing was poured from one cup to the other. How?","storycn":"服务员端来两杯咖啡。第一位客人加了糖，却被叫走了。她回来后喝的是另一杯，她并没有给那杯加糖，可已经是甜的。没有人把两杯对调，也没有把一杯倒进另一杯。怎么回事？","a":"Both coffees were already sweetened by the waiter when they arrived.","acn":"服务员端上来的两杯咖啡本来就已经加过糖了。"},{"story":"Every weekday a man takes a train to the city, always in the first carriage. One day that carriage is almost empty, but he still walks all the way to stand in the last carriage, and he is not meeting anyone. Why?","storycn":"一个男人工作日都坐火车进城，而且总是坐最前面那节车厢。有一天那节车厢几乎是空的，他却一路走到最后一节车厢站着，也不是去跟人会合。为什么？","a":"The exit he needs at the city station is at the back of the train today (for example the front stairs are being repaired), so he needs the last carriage.","acn":"今天到达站时，他要走的出口靠近最后一节车厢（或前面的楼梯在维修），所以他改站到最后一节。"},{"story":"A writer cancels a plane trip because of a dream. The plane lands safely. Later she still says, “My dream came true.” What did she mean?","storycn":"一位作家因为一个梦取消了坐飞机。飞机安全降落。后来她仍说：“我的梦应验了。”她是什么意思？","a":"The dream was a story idea, and she wrote it down the next day, so the dream “came true” on the page.","acn":"那个梦其实是她想到的一个故事，第二天她把它写了出来，所以说梦“应验”了。"},{"story":"A chef puts a cake in the oven, sets a timer, and leaves. When he comes back the cake is perfect, but the kitchen clock on the wall has stopped and the timer is silent. How did he still get the timing right?","storycn":"厨师把蛋糕放进烤箱，设好计时器就离开了。回来时蛋糕烤得刚刚好，可墙上的钟停了，计时器也没有响。他怎么还是掌握了对的时间？","a":"He used a different clock — his watch or his phone.","acn":"他看的是自己的手表或手机，不是墙上那只停了的钟。"},{"story":"Two people are playing a game. One of them keeps saying “check.” Suddenly the other says “I resign.” There is no chessboard in sight. What are they playing?","storycn":"两个人在玩游戏。一个不停地说 check。另一个突然说“我认输了。”可是看不见棋盘。他们在玩什么？","a":"They are playing chess in their heads, or on a phone / computer you cannot see.","acn":"他们在下盲棋，或在手机上下棋，所以你看不见棋盘。"},{"story":"A shopkeeper has a sign in the window: “We never close.” A customer arrives at midnight, finds the front door locked, and the shopkeeper still says the sign is true. How?","storycn":"店主在橱窗写着 We never close（我们从不关门）。顾客午夜到来，前门却锁着，店主仍说这句话是对的。怎么解释？","a":"The front door is locked for security, but the shop is still open through the side entrance.","acn":"大门锁了，但旁边的门仍开着，店其实没有打烊。"},{"story":"A teacher writes a 9 on the board and says: “I am thinking of a 2-digit number. I have written the number of letters in its English name.” What number is a good answer?","storycn":"老师在黑板上写了一个 9，说：“我想的是一个两位数，黑板上是它英文名字的字母个数。”一个好的答案是哪个数？","a":"Seventeen — the word “seventeen” has 9 letters. (Other 9-letter names such as twenty-two also work.)","acn":"Seventeen（17）这个英文单词有 9 个字母。"},{"story":"A girl takes the bus to school every day. She always sits in the same seat. One morning that seat is free, but she stands the whole way and looks happy about it. Why?","storycn":"女孩每天坐巴士上学，总是坐同一个位子。一天早上那个位子空着，她却一路站着，还显得挺高兴。为什么？","a":"She is offering the seat to someone who needs it more, such as an elderly passenger, and she is happy she could help.","acn":"她把座位让给了更需要的人（比如刚上车的爷爷奶奶），所以虽然站着也很高兴。"},{"story":"A man carries a heavy suitcase into a hotel lift on the ground floor. When he gets out on the 8th floor the suitcase feels much easier to carry, but it was never opened and nothing was removed. Why?","storycn":"一个人在一楼提着很重的行李箱进酒店电梯。到 8 楼出来时，箱子感觉轻多了，可箱子一直没打开，里面的东西也没拿出来。为什么？","a":"A porter or a luggage trolley in the lift is now helping him. The suitcase itself is not lighter; he is no longer carrying it alone.","acn":"电梯里的行李车或行李员帮他把箱子一起推了出来，不是箱子自己变轻了。"},{"story":"A woman phones her own house from work every day, lets it ring three times, then hangs up, and never speaks. Why the ritual?","storycn":"一位女士每天下班前给家里打电话，让它响三声就挂掉，从不讲话。这个习惯是为什么？","a":"The three rings are a pre-arranged signal meaning “I’m leaving work, see you soon.” Nobody is meant to pick up, so it costs nothing.","acn":"三声铃响是他们约定的信号，意思是“我下班了，马上回家”，接起来反而要花钱，所以谁也不接。"},{"story":"A man looks at a restaurant menu in a language he cannot read. He does not point or order, but the waiter is delighted and brings a dish the man enjoys. How?","storycn":"一个人看着一份他完全读不懂的菜单。他没有指、也没有点，服务员却很高兴，端上来一道他爱吃的菜。怎么回事？","a":"He booked in advance, or he is a regular and they already know his usual dish.","acn":"他提前订过菜，或他是熟客，服务员已经知道他爱吃什么。"},{"story":"A woman gets on a train, falls asleep, and misses her stop. She does not ask anyone, yet she gets off at the right town in the end. How?","storycn":"一位女士在火车上睡着了，错过了自己的站。她没有问任何人，最后却还是在对的城镇下了车。怎么做到的？","a":"The train was a return or loop service. She woke at the end of the line, and the train went back past her stop, so she got off the second time.","acn":"这是往返列车（或到终点折返），她在回程时再次经过自己的站，第二次就下车了。"},{"story":"People hear a crash in the kitchen and find a broken bowl, a puddle of water, and a smiling child. The child says, “I didn’t drop it,” and the parents believe the child. What happened? (Nothing dangerous.)","storycn":"厨房里传来一声摔碎的声音，大家看见一只破碗、一摊水，还有一个在笑的孩子。孩子说：“不是我摔的。”爸爸妈妈相信了。发生了什么？（没有危险的事。）","a":"A bowl had been sitting on a block of ice (or it was an ice bowl). The ice melted, the bowl slipped by itself, and the child did not touch it.","acn":"碗垫在冰块上，或那是冰做的碗。冰化了，碗自己掉下来，不是孩子摔的。"},{"story":"A boy says: “I was born on 29 February, and I have had only 4 birthdays so far, but I already go to secondary school.” How is that possible?","storycn":"男孩说：“我是 2 月 29 日出生的，到现在只过了 4 个生日，可我已经上中学了。”这怎么可能？","a":"He is about 16 and was born on a leap day, so the calendar date 29 February has only come around four times since he was born.","acn":"他是闰年 2 月 29 日出生的，已经大约 16 岁，日历上这个日期只出现过 4 次。"},{"story":"A postman delivers a letter with no stamp. The person who receives it smiles, writes “NO” on the envelope, and gives it back unopened. Both are happy. Why?","storycn":"邮差送来一封没有邮票的信。收信人笑了笑，在信封上写了个 NO，没有拆开就交回去。两个人都挺高兴。为什么？","a":"Two friends had a yes/no code: a postage-due letter is the question. Refusing it (or writing NO) means “no,” so nobody has to pay, and the answer is sent.","acn":"两个朋友有约定：这封“到付”的信本身就是一个是非题。拒收或写 NO 表示“否”，就不用付邮费。"},{"story":"A musician walks into a room with a piano, stays ten minutes, and comes out having “played nothing.” Yet everyone in the next room applauds. Why?","storycn":"一位音乐家走进有钢琴的房间，待了十分钟，出来时说自己“什么也没弹”。可隔壁房间的人却鼓掌了。为什么？","a":"He was the page-turner. The pianist in the room finished the piece, and the applause is for the performance he helped.","acn":"他是翻谱的人，真正弹琴的是另一位钢琴家，掌声是给这场演出的。"},{"story":"Anthony and Cleopatra are lying on the floor of a house, next to a small puddle of water and some broken glass. They are not people. What happened?","storycn":"Anthony 和 Cleopatra 躺在地板上，旁边有一小滩水和碎玻璃。他们不是人。发生了什么？","a":"They are goldfish. Their bowl was knocked over and broke.","acn":"他们是金鱼，鱼缸被打破了。"},{"story":"A man is lying in bed, unable to fall asleep because of a noise next door. He picks up the phone, says nothing, puts it down, and then falls asleep easily. He did not speak to anyone. Why did this work?","storycn":"一个人躺在床上，因为隔壁的声音睡不着。他拿起电话，什么也没说，放下后就容易睡着了。他没和任何人说话。这是为什么？","a":"The neighbour was snoring (or playing music). He rang the neighbour’s number / the front desk so the ringing would wake them and stop the noise.","acn":"隔壁有人在打鼾或放音乐。他拨了对方的电话（或前台），铃声把那人吵醒，声音就停了。"}],"3":[{"story":"A traveller comes to a fork with two villagers: one always tells the truth, one always lies. One road leads to the village, the other does not. The traveller may ask only one yes/no question, to only one person, and does not know who is who. What should he ask?","storycn":"旅行者来到岔路口，遇见两个村民：一个永远说真话，一个永远说谎。一条路通向村子，另一条不通。他只可以问其中一个人一个是非问题，也不知道谁是谁。他该怎么问？","a":"He asks either person: “If I asked the other person whether this road leads to the village, would they say yes?” Then he takes the opposite of that answer.","acn":"问其中任何一人：“如果我问另一个人，‘这条路是去村子的吗’，他会说是吗？”然后走和他的答案相反的那条路。"},{"story":"A waiter brings a sealed bottle. Three friends order, drink, and leave happily, but none of them opened the bottle, and the seal is still intact. They did drink what they ordered. How?","storycn":"服务员拿来一瓶封着口的饮料。三位朋友点了、也喝到了他们要的东西，高兴地离开，但瓶子的封口完好，谁也没打开这瓶。怎么回事？","a":"They ordered tea or coffee, not that sealed bottle. The bottle was just sitting on the table.","acn":"那瓶封着的是摆在桌上的，他们点的是茶或咖啡，喝的不是那一瓶。"},{"story":"A shop clock in the window is always 15 minutes fast. The shopkeeper has no other clock, radio or phone, yet she unlocks the door at the correct time every morning. How?","storycn":"橱窗里的钟总是快 15 分钟。店主没有别的钟、广播或电话，却每天都能在正确的时间开门。她是怎么做到的？","a":"She knows the window clock is 15 minutes fast, so she unlocks the door when that clock shows 15 minutes after the opening hour (for example at 9:15 on that clock if she opens at 9:00).","acn":"她早就知道橱窗的钟快 15 分钟，所以等那只钟走到开门时间再过 15 分，才去开门。"},{"story":"A king shows two doors: one leads to a job, one to an empty room. Two advisers, one who always tells the truth and one who always lies, each stand by a door. You don’t know who is who or which door is which. You may ask one question to one adviser. What do you ask to find the job?","storycn":"国王出示两扇门，一扇通向职位，一扇通向空房间。两个顾问分别站在门边，一个永远说真话，一个永远说谎，你不知道谁是谁、哪扇是哪扇。只能问其中一个一个问题。该问什么才能找到职位？","a":"Ask either adviser: “If I asked the other adviser whether YOUR door is the job, would he say yes?” Then choose the opposite of the answer.","acn":"问其中任何一人：“如果我问另一个人，‘你这扇门是通向职位的吗’，他会说是吗？”然后按相反的答案选门。"},{"story":"A messenger must take a letter from town A to town B. Between them is a watchtower: anyone who walks in by day is seen. The only safe path is at night, but the journey takes a day and a half of walking, and the messenger has no lamp. He still delivers the letter safely on foot, without being seen. How?","storycn":"信使要把信从 A 镇送到 B 镇。中间有岗楼，白天走过会被看见；只有夜里才安全，但这条路要走一天半，他又没有灯。他还是步行安全地把信送到了，没有被人看见。他怎么做到的？","a":"He walks at night to a hidden halfway point, sleeps through the day, then walks the rest the next night. Two night walks add up to a day and a half.","acn":"他夜里走到中途的隐蔽处，白天躲着睡觉，第二天夜里再走完剩下的路。两段夜路加起来是一天半。"},{"story":"A librarian says: “I have exactly 10 books on this shelf, and the first word of each book is ‘the’ or ‘a’.” A child says “Then I can tell you something that is true of at least 5 of them, without looking.” What can the child already know?","storycn":"图书管理员说：“这层架子上正好 10 本书，每本的第一个词不是 the 就是 a。”一个孩子说：“那我不用看，就知道其中至少 5 本有一个共同点。”孩子已经能知道什么？","a":"By the pigeonhole principle, at least 5 of the 10 books start with the same word (either “the” or “a”).","acn":"根据鸽巢原理，10 本书分成 the / a 两类，至少有 5 本的第一个词是一样的。"},{"story":"A man in a hotel cannot sleep because of noise from the next room. He does not knock, but after one short action the noise stops and he sleeps. The people next door are not angry. What did he do?","storycn":"酒店里的一个人因为隔壁的声音睡不着。他没有去敲门，只做了一件很短的事，声音就停了，他也睡着了。隔壁的人并没有生气。他做了什么？","a":"He phoned the front desk (or the next room), and the staff or the guests quietly turned the noise down.","acn":"他打电话给前台或隔壁，请他们把声音关小，对方照做了。"},{"story":"Three switches, A, B and C, are in a hallway. Only one switch turns on the hall light, but you cannot see the light from the switches. You may press any switches, then walk around the corner once to look at the light. How can you be sure which switch works, if the light is off at the start and also gets warm when it has been on?","storycn":"走廊里有 A、B、C 三个开关，其中只有一个能打开那盏你从开关处看不见的灯。你可以先按开关，再绕过拐角看一次灯。开始时灯是关的，而且亮过的灯会发热。怎样确定是哪个开关？","a":"Turn A on for a few minutes, then turn A off and turn B on, leave C off. Walk around: if the light is on, it is B; if it is off but warm, it is A; if it is off and cold, it is C.","acn":"先开 A 几分钟再关上，然后只开 B。灯是亮的就是 B，又暗又热是 A，又暗又凉是 C。"},{"story":"A ferry has a small boat that holds the ferryman and one passenger. Three traders wait on the bank, and each one does not want to be left on either bank with another trader unless the ferryman is there (they don’t trust each other with goods). How can all three get across, if this “jealous traders” rule is kept? Give a short plan, or say if more information is needed.","storycn":"渡船一次只能载船夫和一名乘客。岸上有三位商人，除非船夫在场，否则任何一位都不愿意和其他商人单独留在同一岸（不放心货物）。怎样让三人都过去？请说一个简短计划。","a":"This is the same shape as the “jealous husbands” / three couples puzzle and cannot be solved in a tiny boat without extra rules (for example a safe island, or the boat holding three). A fair party answer: it cannot be done with only those constraints — you need a bigger boat or a place to wait mid-river. Accept “it can’t be done as stated.”","acn":"按照这样的规则，这么小的船是过不去的，需要更大的船或中途的停靠处。正确答案：按题目这样没法做到。"},{"story":"A girl puts a message in a bottle and throws it into a stream that only flows one way, from her village to the next. The next day she already has a reply in a bottle, and she did not walk to the other village. How?","storycn":"女孩把纸条放进瓶子，扔进一条只从她的村子流向邻村的小溪。第二天她已经收到了装在瓶子里的回信，可她并没有走到邻村去。怎么回事？","a":"A friend / sibling from the other village had already come upstream by road that day, or the reply was written by someone in her own village as a joke. A neater answer: the “stream” is a play table-river, and her brother at the other end of the table sent a bottle back by hand. Prefer: her friend in the next village came over by the path (the stream only goes one way, people don’t).","acn":"小溪只能单向流，人却可以沿路走回来。邻村的朋友把回信的瓶子亲自带了回来，或沿路放进上游。"},{"story":"There are 3 boxes. You know that exactly one label is true, and the other two are false. The labels say: “apples”, “oranges”, and “this box is empty.” You may open only the box labelled “this box is empty.” Inside it you find apples. What is in the other two boxes?","storycn":"三个箱子，正好一张标签是对的，另外两张是错的。标签分别是“苹果”“橙子”“这个箱子是空的”。你只打开了写着“这个箱子是空的”的箱子，里面是苹果。另外两个箱子里是什么？","a":"The opened box’s label is false (it is not empty). So one of the other two labels is the true one. It cannot be “apples” if that other box is not apples; but we already found the apples, so the box labelled “apples” cannot be true (that label would need to have apples, but the apples are already in the opened box). Therefore the true label is “oranges”: that box has oranges, and the box labelled “apples” is empty (its label is false).","acn":"打开的箱子标签是错的（并非空）。唯一正确的标签只能是“橙子”，所以那箱是橙子；标着“苹果”的箱子是空的。"},{"story":"A conductor walks from the front of a 3-carriage train to the back once and never turns around, yet by the time the train leaves he has checked every ticket. How, if the doors were open the whole time?","storycn":"列车员从三节车厢的最前面走到最后面，中间没有回头，车开时他却已经给所有人检了票。车门一直开着，这怎么可能？","a":"He started after all passengers had already boarded, so nobody got on behind him after he passed. (Or: another conductor started from the back at the same time.)","acn":"他是在所有人都上齐之后才开始检票的，所以走过之后不会再有人从后面上车。或者另一位列车员从后面同时检。"},{"story":"A woman always leaves her house key under a flower pot when she goes out. One evening the pot has been moved, the key is gone, and the door is locked — but her flat is untouched and the key is in the lock on the inside. She lives alone. What happened?","storycn":"女士出门时总把钥匙放在花盆下面。一天晚上花盆被挪开了，钥匙不见了，门也锁着——可屋里什么都没被动过，钥匙在门内侧的锁孔里。她是一个人住。发生了什么？","a":"She had already gone back in earlier (or never really left the second time) and locked herself in, taking the key with her from under the pot. Or a neighbour used the spare, went in to water the plants as agreed, and left the key in the inside lock. Prefer the neighbour with permission: a friend watered the plants and left the key inside.","acn":"是约好的邻居或朋友进来帮她浇花，用完把钥匙留在门内侧了。屋里没有被翻乱。"},{"story":"A baker says half the cakes in the window were sold in the morning and half of what remained in the afternoon, and 3 cakes are left. If that is all true, how many cakes were in the window at the start? Is more than one answer possible?","storycn":"面包师傅说：早上卖掉橱窗里蛋糕的一半，下午又卖掉剩下的一半，最后还剩 3 个。若这是真的，一开始有几个蛋糕？答案唯一吗？","a":"12 cakes. After half are sold, 6 remain; after half of those are sold, 3 remain. Starting from 3 and doubling twice gives a unique whole number: 12. (If “half” must be a whole cake each time, 12 is the unique small answer.)","acn":"从剩下的 3 个往回推：下午卖掉一半说明下午开始是 6 个；早上卖掉一半说明一开始是 12 个。在整数块蛋糕的条件下答案是唯一的。"},{"story":"A child is looking at a map of the world. She points to a place and says, “Here, I can walk one kilometre south, one kilometre west, one kilometre north, and be back where I started — but it is not the North Pole.” Where could she be pointing?","storycn":"孩子看着世界地图，指着一个地方说：“在这里我可以向南走 1 公里，向西走 1 公里，再向北走 1 公里，正好回到起点——但这里不是北极。”她可能指的是哪里？","a":"Near the South Pole: on the circle of latitude whose circumference is 1 km, at a distance of 1 km north of that circle (or 1 km north of a circle of circumference 1/n km). Walking south 1 km, then west 1 km loops that circle exactly, then north 1 km returns to the start.","acn":"在南极附近：先向南走到周长正好是 1 公里（或 1/n 公里）的纬线圈上，再向西走一圈，最后向北走回起点。"}]}};

/* renderers + generators */
const SHAPES=["circle","triangle","square"];
const SCOLORS=["#e53935","#fdd835","#1e88e5"];
const SBGS=["#ffffff","#9e9e9e","#212121"];
const SCOLN=["red","yellow","blue"];
const SBGN=["white","grey","black"];

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rand(n){return Math.floor(Math.random()*n);}
function pick(arr){return arr[rand(arr.length)];}

/* ---------- matchsticks ---------- */
const SEGS={0:"abcdef",1:"bc",2:"abged",3:"abcdg",4:"bcfg",5:"acdfg",6:"acdefg",7:"abc",8:"abcdefg",9:"abcdfg"};
const SEGXY={
  a:[10,6,34,6], b:[36,8,36,28], c:[36,34,36,54], d:[10,56,34,56],
  e:[8,34,8,54], f:[8,8,8,28], g:[10,31,34,31]
};
const OPXY={h:[8,31,36,31], v:[22,10,22,52], 1:[8,22,36,22], 2:[8,40,36,40]};
function sticksOn(ch){
  if(ch>="0"&&ch<="9") return [...SEGS[ch]];
  if(ch==="+") return ["h","v"];
  if(ch==="-") return ["h"];
  if(ch==="=") return ["1","2"];
  return [];
}
function renderSticks(eq, opts){
  opts=opts||{};
  const dw=46, ow=42, pad=10, H=70;
  let x=pad, glyphs=[];
  for(const ch of eq){
    const w=(ch==="+"||ch==="-"||ch==="=")?ow:dw;
    glyphs.push({ch,x,w});
    x+=w+6;
  }
  const W=x+pad;
  let lines="";
  function stick(x1,y1,x2,y2){
    lines+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#8d2b12" stroke-width="6" stroke-linecap="round"/>`;
  }
  for(const g of glyphs){
    const on=sticksOn(g.ch);
    if(g.ch>="0"&&g.ch<="9"){
      for(const sl of on){const p=SEGXY[sl]; stick(g.x+p[0],p[1],g.x+p[2],p[3]);}
    }else{
      for(const sl of on){const p=OPXY[sl]; stick(g.x+p[0],p[1],g.x+p[2],p[3]);}
    }
  }
  const label=opts.label?`<text x="${W/2}" y="${H+22}" text-anchor="middle" font-size="16" font-weight="700" fill="#444">${esc(opts.label)}</text>`:"";
  const extra=opts.label?28:0;
  return `<svg class="sticksvg" viewBox="0 0 ${W} ${H+extra}" width="${Math.min(900,W*1.6)}" xmlns="http://www.w3.org/2000/svg">${lines}${label}</svg>`;
}

/* ---------- count figures ---------- */
function renderFigure(fig, maxW){
  const pts=fig.points;
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  pts.forEach(p=>{minx=Math.min(minx,p[0]);miny=Math.min(miny,p[1]);maxx=Math.max(maxx,p[0]);maxy=Math.max(maxy,p[1]);});
  const bw=maxx-minx||1, bh=maxy-miny||1;
  const pad=24;
  const tw=(maxW||720);
  const scale=Math.min((tw-2*pad)/bw, (420-2*pad)/bh);
  const W=bw*scale+2*pad, H=bh*scale+2*pad;
  const xy=p=>[(p[0]-minx)*scale+pad,(p[1]-miny)*scale+pad];
  let d="";
  (fig.edges||[]).forEach(([i,j])=>{
    const a=xy(fig.points[i]), b=xy(fig.points[j]);
    d+=`<line x1="${a[0].toFixed(2)}" y1="${a[1].toFixed(2)}" x2="${b[0].toFixed(2)}" y2="${b[1].toFixed(2)}" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>`;
  });
  return `<svg class="countsvg" viewBox="0 0 ${W.toFixed(1)} ${H.toFixed(1)}" width="${Math.min(tw,W)}" xmlns="http://www.w3.org/2000/svg">${d}</svg>`;
}

/* ---------- rebus ---------- */
function renderRebus(p){
  const L=p.layout;
  if(L==="stack") return `<div class="rebus">${p.lines.map(t=>`<div class="rw">${esc(t)}</div>`).join("")}</div>`;
  if(L==="under") return `<div class="rebus runder"><div class="rw">${esc(p.top)}</div><div class="rw">${esc(p.bottom)}</div></div>`;
  if(L==="repeat") return `<div class="rebus">${Array.from({length:p.n},()=>`<div class="rw">${esc(p.word)}</div>`).join("")}</div>`;
  if(L==="box") return `<div class="rebus"><div class="rbox">${esc(p.inner)}</div></div>`;
  if(L==="low") return `<div class="rebus"><div class="rw rlow">${esc(p.word)}</div></div>`;
  if(L==="high") return `<div class="rebus"><div class="rw rhigh">${esc(p.word)}</div></div>`;
  if(L==="words") return `<div class="rebus"><div class="rwords">${p.parts.map(t=>`<span>${esc(t)}</span>`).join("")}</div>${p.sub?`<div class="rw sm">${esc(p.sub)}</div>`:""}</div>`;
  if(L==="scramble"){
    const rot=[-18,12,-8,22,-25,15,8,-14,20,-10];
    return `<div class="rebus scramble">${p.letters.map((ch,i)=>`<span style="transform:rotate(${rot[i%rot.length]}deg) translateY(${(i%3)*18-12}px)">${esc(ch)}</span>`).join("")}</div>`;
  }
  if(L==="eyes") return `<div class="rebus eyes">i&nbsp;&nbsp;i&nbsp;&nbsp;i<br>◯&nbsp;&nbsp;◯&nbsp;&nbsp;◯</div>`;
  if(L==="between_lines") return `<div class="rebus lines"><div class="hline"></div><div class="rw">${esc(p.word)}</div><div class="hline"></div></div>`;
  if(L==="split") return `<div class="rebus rwords"><span class="rw">${esc(p.parts[0])}</span><span style="width:28px"></span><span class="rw">${esc(p.parts[1])}</span></div>`;
  if(L==="circle"){
    const w=p.word, n=w.length;
    let h="";
    for(let i=0;i<n;i++){
      const ang=-90+i*(360/n);
      h+=`<div class="circword" style="transform:rotate(${ang}deg) translate(120px) rotate(90deg)">${esc(w[i])}</div>`;
    }
    return `<div class="rebus"><div class="circwrap">${h}</div></div>`;
  }
  if(L==="highlow") return `<div class="rebus highlow"><div>${esc(p.word)}</div><div>${esc(p.word)}</div></div>`;
  if(L==="million") return `<div class="rebus"><div class="rw sm">1 in</div><div class="rw">1,000,000</div></div>`;
  if(L==="square1") return `<div class="rebus"><div class="sq1"><span>← BACK</span><div class="box">1</div></div></div>`;
  if(L==="nowhere") return `<div class="rebus"><div class="rw">NO<span style="color:#2b7a0b;text-decoration:underline">WHE</span>RE</div><div class="rw sm">↑ middle</div></div>`;
  if(L==="tiny") return `<div class="rebus">${p.prefix?`<div class="rw">${esc(p.prefix)}</div>`:""}<div class="rw tiny">${esc(p.word)}</div></div>`;
  if(L==="outside_box") return `<div class="rebus outbox"><div class="rw">${esc(p.word)}</div><div class="obox"></div></div>`;
  if(L==="clouds") return `<div class="rebus cloudbox">☁️ ☁️ ☁️<br><span class="rw">HEAD</span><br>☁️ ☁️</div>`;
  if(L==="tilt") return `<div class="rebus"><div class="rw tilt">${esc(p.word)}</div></div>`;
  if(L==="mirror") return `<div class="rebus"><div class="mirror">${esc(p.word)}</div></div>`;
  if(L==="between_words") return `<div class="rebus btw"><span>${esc(p.left)}</span><span style="opacity:.35">· · ·</span><span>${esc(p.right)}</span></div>`;
  if(L==="middle_word"){
    const o=p.outer, mid=Math.floor(o.length/2);
    const a=o.slice(0,Math.max(1,mid-Math.floor(p.inner.length/2)));
    const b=o.slice(a.length);
    return `<div class="rebus"><div class="midw">${esc(a)}<em>${esc(p.inner)}</em>${esc(b)}</div></div>`;
  }
  if(L==="needle"){
    const hay="hay hay hay hay hay hay hay hay hay hay hay hay hay hay hay hay hay hay hay hay";
    return `<div class="rebus hay">${esc(hay)} <span class="needle">needle</span> ${esc(hay)}</div>`;
  }
  if(L==="snake_grass") return `<div class="rebus"><div class="grass">G R A <span class="sn">SNAKE</span> S S</div></div>`;
  if(L==="around_clock") return `<div class="rebus"><div class="clockring">CLOCK</div></div>`;
  if(L==="backback") return `<div class="rebus backs"><span>BACK</span><span>BACK</span></div>`;
  if(L==="scattered"){
    const letters=[...(p.prefix?p.prefix+" ":"")+p.word];
    return `<div class="rebus scatter">${letters.map((ch,i)=>`<span style="transform:translate(${(i%5-2)*8}px,${((i*3)%7-3)*14}px) rotate(${(i%5-2)*8}deg)">${esc(ch===" "?"·":ch)}</span>`).join("")}</div>`;
  }
  if(L==="out_bounds") return `<div class="rebus"><div class="bounds"><span class="out">OUT</span>BOUNDS</div></div>`;
  if(L==="wall") return `<div class="rebus"><div class="wall">${esc(p.word)}</div></div>`;
  if(L==="away") return `<div class="rebus away">${esc(p.word)}</div>`;
  if(L==="hole_in_one") return `<div class="rebus"><div class="hole1">1</div></div>`;
  if(L==="i_unionized") return `<div class="rebus"><div class="unionized">UN<span class="ii">I</span>ONIZED</div></div>`;
  if(L==="every_then") return `<div class="rebus everythen">EVERY<br>now<br>AND THEN</div>`;
  return `<div class="rebus rw">${esc(p.ans||"")}</div>`;
}

/* ---------- Hap! Gyul! ---------- */
function isHap(a,b,c){
  return ["s","c","b"].every(k=>{
    const n=new Set([a[k],b[k],c[k]]).size;
    return n===1||n===3;
  });
}
function allHaps(board){
  const h=[];
  for(let i=0;i<9;i++) for(let j=i+1;j<9;j++) for(let k=j+1;k<9;k++)
    if(isHap(board[i],board[j],board[k])) h.push([i+1,j+1,k+1]);
  return h;
}
function genHapBoard(lo,hi){
  const all=[];
  for(let s=0;s<3;s++) for(let c=0;c<3;c++) for(let b=0;b<3;b++) all.push({s,c,b});
  for(let t=0;t<800;t++){
    shuffle(all);
    const board=all.slice(0,9).map(x=>({s:x.s,c:x.c,b:x.b}));
    const haps=allHaps(board);
    if(haps.length>=lo && haps.length<=hi) return {board,haps};
  }
  // fallback: take whatever is closest
  let best=null, bestd=99;
  for(let t=0;t<200;t++){
    shuffle(all);
    const board=all.slice(0,9).map(x=>({s:x.s,c:x.c,b:x.b}));
    const haps=allHaps(board);
    const d=haps.length<lo?lo-haps.length:haps.length-hi;
    if(d<bestd){bestd=d;best={board,haps};}
  }
  return best;
}
function shapePath(s, cx, cy, r){
  if(s===0) return `<circle cx="${cx}" cy="${cy}" r="${r*0.72}" fill="SHAPE" stroke="#111" stroke-width="3"/>`;
  if(s===1){
    const h=r*1.15, w=r;
    return `<polygon points="${cx},${cy-h*0.62} ${cx+w},${cy+h*0.42} ${cx-w},${cy+h*0.42}" fill="SHAPE" stroke="#111" stroke-width="3"/>`;
  }
  const q=r*0.7;
  return `<rect x="${cx-q}" y="${cy-q}" width="${q*2}" height="${q*2}" fill="SHAPE" stroke="#111" stroke-width="3"/>`;
}
function renderHapBoard(board, foundSet, size){
  const cells=board.map((t,i)=>{
    const n=i+1;
    const found=foundSet && [...foundSet].some(key=>key.split(/[-,\s]+/).map(Number).includes(n) && false);
    // highlight if this tile belongs to any found hap
    let hit=false;
    if(foundSet){
      for(const k of foundSet){
        const parts=k.split(/[-,\s]+/).map(Number);
        if(parts.includes(n)) hit=true;
      }
    }
    const svg=`<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="116" height="116" rx="10" fill="${SBGS[t.b]}" stroke="#333" stroke-width="2"/>
      ${shapePath(t.s,60,62,42).replace("SHAPE",SCOLORS[t.c])}
    </svg>`;
    return `<div class="hapcell${hit?" found":""}"><span class="hapn">${n}</span>${svg}</div>`;
  }).join("");
  return `<div class="hapboard">${cells}</div>`;
}
function hapKey(triple){
  return [...triple].sort((a,b)=>a-b).join("-");
}
function parseTriple(s){
  const nums=String(s).match(/\d+/g);
  if(!nums||nums.length!==3) return null;
  const t=nums.map(Number);
  if(t.some(n=>n<1||n>9)||new Set(t).size!==3) return null;
  return t;
}

/* ---------- Make the Number ---------- */
function safeEval(expr){
  const e=String(expr).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
  if(!/^[\d+\-*/().\s]+$/.test(e)) throw new Error("bad expr");
  const v=Function('"use strict";return ('+e+")")();
  if(typeof v!=="number"||!Number.isFinite(v)) throw new Error("nan");
  return v;
}
function stripParens(expr){
  let s=String(expr).trim();
  while(s[0]==="(" && s[s.length-1]===")"){
    let d=0,ok=true;
    for(let i=0;i<s.length;i++){
      if(s[i]==="(")d++;
      else if(s[i]===")"){d--; if(d===0 && i<s.length-1){ok=false;break;}}
    }
    if(!ok||d!==0) break;
    s=s.slice(1,-1).trim();
  }
  return s;
}
function prettyExpr(expr){
  return stripParens(expr).replace(/\*/g,"×").replace(/\//g,"÷");
}
function genNumberPuzzle(level){
  const cfg={
    1:{n:4, lo:1, hi:9, ops:["+","-","*"], tmax:80, tmin:8},
    2:{n:5, lo:1, hi:12, ops:["+","-","*","/"], tmax:120, tmin:10},
    3:{n:5, lo:2, hi:20, ops:["+","-","*","/"], tmax:200, tmin:15}
  }[level]||{n:4,lo:1,hi:9,ops:["+","-","*"],tmax:80,tmin:8};
  for(let attempt=0;attempt<400;attempt++){
    const nums=[];
    while(nums.length<cfg.n){const x=cfg.lo+rand(cfg.hi-cfg.lo+1); nums.push(x);}
    const items=nums.map(n=>({expr:String(n),val:n}));
    let guard=0, ok=true;
    while(items.length>1 && guard++<80){
      const i=rand(items.length), a=items.splice(i,1)[0];
      const j=rand(items.length), b=items.splice(j,1)[0];
      const op=pick(cfg.ops);
      let val, expr, good=true;
      if(op==="+"){val=a.val+b.val; expr=`(${a.expr}+${b.expr})`;}
      else if(op==="-"){
        // keep non-negative for L1/L2
        if(level<3 && a.val<b.val){const t=a; /* swap */ val=b.val-a.val; expr=`(${b.expr}-${a.expr})`;}
        else {val=a.val-b.val; expr=`(${a.expr}-${b.expr})`;}
        if(level<3 && val<0) good=false;
      }else if(op==="*"){val=a.val*b.val; expr=`(${a.expr}*${b.expr})`; if(Math.abs(val)>5000) good=false;}
      else{
        if(b.val===0 || a.val%b.val!==0){good=false;}
        else {val=a.val/b.val; expr=`(${a.expr}/${b.expr})`;}
      }
      if(!good || !Number.isFinite(val) || !Number.isInteger(val)){
        items.push(a,b);
        if(guard>60){ok=false;break;}
        continue;
      }
      items.push({expr,val});
    }
    if(!ok || items.length!==1) continue;
    const target=items[0].val;
    if(!Number.isInteger(target) || target<cfg.tmin || target>cfg.tmax) continue;
    if(nums.includes(target) && nums.length>1 && Math.random()<0.5) continue;
    const expr=prettyExpr(items[0].expr);
    try{
      if(safeEval(expr)!==target) continue;
    }catch(e){continue;}
    return {nums:nums.slice(), target, expr, level};
  }
    // verified fallbacks if random generation is unlucky
  if(level===1) return {nums:[2,4,6,8], target:24, expr:"(8−2)×(6−2)", level:1};
  if(level===2) return {nums:[2,3,4,6,8], target:24, expr:"(8−2)×6−3×4", level:2};
  return {nums:[5,7,8,11,12], target:24, expr:"12×8−11×7+5", level:3};
}

].map(g=>g.filter(x=>x!=="🐷"&&x!=="🐽"&&x!=="🐗")).filter(g=>g.length);
// remove empty
const ROTATABLE=["➡️","✈️","🍌","☂️","🔑","🥕","🐟","🖊️","🎸","✂️","🥄","🪁","🛶","🦈","🔔","🌙","🔧","🔨","📍","🦋","🦒","🦩","🍋","👟","🛶","🎺","☂️"];
function genSamePicture(level){
  const size=level===1?4:level===2?5:6;
  const nPairs=level===3?2:1;
  const N=size*size;
  for(let attempt=0;attempt<80;attempt++){
    const tiles=new Array(N);
    const used=new Set(); // emoji|rot
    const pairs=[];
    const groups=shuffle(EMOJI_GROUPS.map(g=>g.slice()));
    // place pairs first
    const cells=shuffle([...Array(N).keys()]);
    let ci=0;
    let ok=true;
    for(let p=0;p<nPairs;p++){
      const useRot=Math.random()<0.4 && ROTATABLE.length;
      let emoji, rot=0;
      if(useRot){emoji=pick(ROTATABLE); rot=0;}
      else{
        const g=groups[p%groups.length];
        emoji=pick(g);
      }
      const key=emoji+"|"+rot;
      if(used.has(key)){ok=false;break;}
      used.add(key);
      const a=cells[ci++], b=cells[ci++];
      tiles[a]={emoji,rot}; tiles[b]={emoji,rot};
      pairs.push([a+1,b+1]);
      // distractors: same emoji other rotation and similar group
      if(ROTATABLE.includes(emoji)){
        for(const r of [90,180,270]){
          const k=emoji+"|"+r;
          if(!used.has(k) && ci<N && Math.random()<0.8){
            used.add(k);
            tiles[cells[ci++]]={emoji,rot:r};
          }
        }
      }
      const grp=EMOJI_GROUPS.find(g=>g.includes(emoji));
      if(grp){
        for(const e of shuffle(grp.slice())){
          if(e===emoji) continue;
          const k=e+"|0";
          if(!used.has(k) && ci<N){
            used.add(k);
            tiles[cells[ci++]]={emoji:e,rot:0};
          }
        }
      }
    }
    if(!ok) continue;
    // fill remaining with unique emojis
    const pool=shuffle(EMOJI_GROUPS.flat().filter(e=>!used.has(e+"|0")));
    const extraRot=shuffle(ROTATABLE.filter(e=>!used.has(e+"|0")));
    let pi=0, ri=0;
    while(ci<N){
      let placed=false;
      if(ri<extraRot.length && Math.random()<0.25){
        const e=extraRot[ri++];
        const rots=shuffle([0,90,180,270]);
        for(const r of rots){
          const k=e+"|"+r;
          if(!used.has(k)){
            used.add(k); tiles[cells[ci++]]={emoji:e,rot:r}; placed=true; break;
          }
        }
      }
      if(!placed){
        while(pi<pool.length && used.has(pool[pi]+"|0")) pi++;
        if(pi>=pool.length){ok=false;break;}
        const e=pool[pi++];
        used.add(e+"|0");
        tiles[cells[ci++]]={emoji:e,rot:0};
      }
    }
    if(!ok || tiles.some(t=>!t)) continue;
    // verify uniqueness
    const map=new Map();
    tiles.forEach((t,i)=>{
      const k=t.emoji+"|"+t.rot;
      if(!map.has(k)) map.set(k,[]);
      map.get(k).push(i+1);
    });
    const dups=[...map.values()].filter(v=>v.length>=2);
    if(dups.some(v=>v.length!==2)) continue;
    if(dups.length!==nPairs) continue;
    // check pairs match intended (order-insensitive)
    return {size, nPairs, tiles, pairs:dups, level};
  }
  // very simple fallback: first two cells same smiley, rest unique from a flat list
  const flat=EMOJI_GROUPS.flat();
  const tiles=[{emoji:flat[0],rot:0},{emoji:flat[0],rot:0}];
  for(let i=2;i<N;i++) tiles.push({emoji:flat[i],rot:0});
  return {size, nPairs:1, tiles, pairs:[[1,2]], level};
}
function renderSame(item, highlight){
  const hi=new Set();
  (highlight||[]).forEach(pair=>pair.forEach(n=>hi.add(n)));
  const cells=item.tiles.map((t,i)=>{
    const n=i+1;
    const rot=t.rot?`transform:rotate(${t.rot}deg)`:"";
    return `<div class="samecell${hi.has(n)?" hit":""}"><span class="n">${n}</span><span class="em" style="${rot}">${t.emoji}</span></div>`;
  }).join("");
  return `<div class="samegrid s${item.size}" style="grid-template-columns:repeat(${item.size},1fr)">${cells}</div>`;
}

let POOLS=null;

function fillGenerated(level, n){
  const hapRange={1:[5,8],2:[3,5],3:[1,2]};
  const hap=[], num=[], same=[];
  const [lo,hi]=hapRange[level];
  for(let i=0;i<n;i++){
    const h=genHapBoard(lo,hi);
    hap.push({mode:"hap", level, board:h.board, haps:h.haps, _key:"hap"+level+"-"+i+"-"+Math.random().toString(36).slice(2,6)});

function ensureGenerated(){
  if(!POOLS.hap){POOLS.hap={1:[],2:[],3:[]};POOLS.number={1:[],2:[],3:[]};POOLS.same={1:[],2:[],3:[]};}
  for(const lv of [1,2,3]){
    if(POOLS.hap[lv].length>=20) continue;
    const g=fillGenerated(lv, 20);
    POOLS.hap[lv]=g.hap;
    POOLS.number[lv]=g.number;
    POOLS.same[lv]=g.same;
  }
}

function poolFor(mode, lvl){
  if(mode==="mix") return mixPool(lvl);
  ensureGenerated();
  const src=POOLS[mode];
  if(!src) return [];
  if(lvl==="all") return [...(src[1]||[]),...(src[2]||[]),...(src[3]||[])];
  return (src[lvl]||[]).slice();
}
function mixPool(lvl){
  ensureGenerated();
  const modes=["math","riddle","iq","sticks","rebus","logic","count","mystery","hap","number","same"];
  const out=[];
  modes.forEach(m=>{
    const src=POOLS[m];
    const levels=lvl==="all"?["1","2","3"]:[lvl];
    levels.forEach(l=>(src[l]||[]).forEach(it=>out.push(it)));
  });
  return out;
}

function pickNext(){
  const mode=modeId(), lvl=levelVal();
  const uk=mode+"|"+lvl;
  if(!used[uk]) used[uk]=new Set();
  let p=poolFor(mode,lvl);
  if(!p.length) return null;
  if(mode==="mix"){
    // random among unused
    let left=p.filter(it=>!used[uk].has(itemKey(it)));
    if(!left.length){used[uk]=new Set(); left=p.slice();
      // regenerate generated modes for freshness
      POOLS.hap=POOLS.number=POOLS.same=undefined;
      ensureGenerated();
      p=poolFor(mode,lvl); left=p.slice();
    }
    const it=left[Math.floor(Math.random()*left.length)];
    used[uk].add(itemKey(it));
    return it;
  }
  // single-mode: easy→hard order, no repeat until exhausted
  let left=p.filter(it=>!used[uk].has(itemKey(it)));
  if(!left.length){
    used[uk]=new Set();
    if(mode==="hap"||mode==="number"||mode==="same"){
      const g=fillGenerated(+((lvl==="all")?"1":lvl)||1, 20);
      if(lvl==="all"){
        POOLS.hap=POOLS.number=POOLS.same=undefined;
        ensureGenerated();
      }else{
        POOLS[mode][lvl]=g[mode==="hap"?"hap":mode];
        // only refresh this mode; keep others
        if(mode==="hap") POOLS.hap[lvl]=g.hap;
        if(mode==="number") POOLS.number[lvl]=g.number;
        if(mode==="same") POOLS.same[lvl]=g.same;
      }
      p=poolFor(mode,lvl);
    }
    left=p.slice();
  }
  const it=left[0];
  used[uk].add(itemKey(it));
  return it;
}

function hostAnswerHTML(it){
  if(!it) return "—";
  if(it.mode==="math"||it.mode==="riddle"||it.mode==="iq") return `<div class="lab">Answer 答案</div><div class="secret ansline">${esc(it.a)}</div><div class="secret why">${esc(it.why||"")}</div>`;
  if(it.mode==="sticks") return `<div class="lab">Answer 答案（移动 ${it.moves} 根）</div><div class="secret">${renderSticks(it.a,{label:it.a+"   (move "+it.moves+")"})}</div>`;
  if(it.mode==="rebus") return `<div class="lab">Answer 答案</div><div class="secret ansline">${esc(it.ans)}</div><div class="secret why">${esc(it.cn||"")}</div>`;
  if(it.mode==="logic") return `<div class="lab">Answer 答案</div><div class="secret ansline">${esc(it.a)}</div><div class="secret why">${esc(it.why||"")}</div>`;
  if(it.mode==="count") return `<div class="lab">Answer 答案</div><div class="secret ansline">${it.ans}</div>`;
  if(it.mode==="mystery") return `<div class="lab">Answer 答案（yes/no only until Reveal）</div><div class="secret ansline">${esc(it.a)}</div><div class="secret why">${esc(it.acn||"")}</div>`;
  if(it.mode==="hap"){
    const all=it.haps.map(t=>t.join("-")).join("   ·   ");
    return `<div class="lab">All Haps 全部的合（${it.haps.length}）</div><div class="secret" style="font-size:22px;font-weight:800">${esc(all||"（none）")}</div>`;
  }
  if(it.mode==="number") return `<div class="lab">One solution 一种算法</div><div class="secret ansline">${esc(it.expr)} = ${it.target}</div>`;
  if(it.mode==="same"){
    const ps=it.pairs.map(p=>p.join(" & ")).join("　and　");
    return `<div class="lab">Matching pair(s) 相同的格子</div><div class="secret ansline">${esc(ps)}</div>`;
  }
  return "";
}

function stageHTML(it, isDisplay, isRev){
  if(!it) return `<div class="prompt">按「下一题」开始　Press Next to start</div>`;
  let body="";
  if(it.mode==="math"||it.mode==="riddle"||it.mode==="iq"){
    const big=(it.kind==="emoji"||it.kind==="odd")?" emath":"";
    body=`<div class="qtext${big}">${esc(it.q)}</div>`+(it.qcn?`<div class="qcn">${esc(it.qcn)}</div>`:"");
    if(isRev) body+=`<div class="ansline" style="margin-top:18px">🎉 ${esc(it.a)}</div><div class="why">${esc(it.why||"")}</div>`;
  }else if(it.mode==="sticks"){
    body=`<div class="prompt">Move ${it.moves} stick${it.moves>1?"s":""} to make a true equation</div>
          <div class="promptcn">移动 ${it.moves} 根火柴，让算式成立</div>
          ${renderSticks(it.q)}`;
    if(isRev) body+=`<div class="ansline" style="margin-top:16px">🎉 ${esc(it.a)}</div>${renderSticks(it.a,{label:"Answer 答案"})}`;
  }else if(it.mode==="rebus"){
    body=renderRebus(it);
    if(isRev) body+=`<div class="ansline" style="margin-top:16px">🎉 ${esc(it.ans)}</div><div class="why">${esc(it.cn||"")}</div>`;
  }else if(it.mode==="logic"){
    body=`<div class="qtext">${esc(it.q)}</div><div class="qcn">${esc(it.qcn||"")}</div>`;
    if(isRev) body+=`<div class="ansline" style="margin-top:18px">🎉 ${esc(it.a)}</div><div class="why">${esc(it.why||"")}</div>`;
  }else if(it.mode==="count"){
    body=`<div class="prompt">${esc(it.prompt)}</div><div class="promptcn">${esc(it.cn||"")}</div>${renderFigure(it, isDisplay?900:640)}`;
    if(isRev) body+=`<div class="ansline" style="margin-top:14px">🎉 ${it.ans}</div>`;
  }else if(it.mode==="mystery"){
    body=`<div class="story">${esc(it.story)}<div class="qcn">${esc(it.storycn||"")}</div><div class="hint">Ask the host yes / no questions. 可以向主持人问是非题。</div></div>`;
    if(isRev) body+=`<div class="ansline" style="margin-top:18px">🎉 ${esc(it.a)}</div><div class="why">${esc(it.acn||"")}</div>`;
  }else if(it.mode==="hap"){
    body=renderHapBoard(it.board, hapFound);
    const found=[...hapFound].join("   ·   ");
    body+=`<div class="hapfound" style="margin-top:12px">${found?("Found 已找到："+found):"No Haps found yet 还没有找到合"}</div>`;
    if(isRev){
      const miss=it.haps.filter(t=>!hapFound.has(hapKey(t)));
      if(miss.length===0) body+=`<div class="ansline" style="margin-top:12px">🎉 结！Gyul! All found 全部找到了</div>`;
      else body+=`<div class="ansline" style="margin-top:12px">Missing 还没找到：${miss.map(t=>t.join("-")).join("   ·   ")}</div>`;
    }
  }else if(it.mode==="number"){
    body=`<div class="numbox"><div class="prompt">Make the number 凑出这个数</div>
      <div class="nums">${it.nums.map(n=>`<div class="num">${n}</div>`).join("")}</div>
      <div class="target">Target 目标：<em>${it.target}</em></div></div>`;
    if(isRev) body+=`<div class="ansline" style="margin-top:16px">🎉 ${esc(it.expr)} = ${it.target}</div>`;
  }else if(it.mode==="same"){
    body=`<div class="prompt">Find the matching pair${it.nPairs>1?"s":""} 找出相同的${it.nPairs>1?"两对":"一对"}</div>
          ${renderSame(it, isRev?it.pairs:sameFound)}`;
    if(isRev) body+=`<div class="ansline" style="margin-top:12px">🎉 ${it.pairs.map(p=>p.join(" & ")).join("　and　")}</div>`;
  }
  return `<div class="pwrap">${body}</div>`;
}

function specialVisible(){
  const el=root.getElementById("special");
  if(!current){el.classList.add("hidden");el.innerHTML="";return;}
  if(current.mode==="hap"){
    el.classList.remove("hidden");
    el.innerHTML=`<label class="dd">合 Hap <input id="hapIn" type="text" placeholder="e.g. 1 4 7" style="width:140px"></label>
      <button class="big" id="hapBtn">✅ Hap</button>
      <button class="warn" id="gyulBtn">结 Gyul</button>
      <span class="foundlist" id="hapStatus">Found ${hapFound.size} / ${current.haps.length}</span>`;
    root.getElementById("hapBtn").onclick=submitHap;
    root.getElementById("gyulBtn").onclick=submitGyul;
    root.getElementById("hapIn").onkeydown=e=>{if(e.key==="Enter")submitHap();};
    return;
  }
  if(current.mode==="same"){
    el.classList.remove("hidden");
    el.innerHTML=`<label class="dd">Pair 配对 <input id="sameIn" type="text" placeholder="e.g. 3 11" style="width:140px"></label>
      <button class="big" id="sameBtn">✅ Check</button>
      <span class="foundlist" id="sameStatus">Found ${sameFound.length} / ${current.nPairs}</span>`;
    root.getElementById("sameBtn").onclick=submitSame;
    root.getElementById("sameIn").onkeydown=e=>{if(e.key==="Enter")submitSame();};
    return;
  }
  el.classList.add("hidden");el.innerHTML="";
}

function submitHap(){
  if(!current||current.mode!=="hap"||revealed) return;
  const t=parseTriple(root.getElementById("hapIn").value);
  const status=root.getElementById("hapStatus");
  if(!t){status.innerHTML='<span class="bad">Type 3 different numbers 1–9, e.g. 1 4 7</span>';sfx("wrong");return;}
  const key=hapKey(t);
  const ok=current.haps.some(h=>hapKey(h)===key);
  if(!ok){status.innerHTML=`<span class="bad">Not a Hap: ${t.join(" ")}</span>`;sfx("wrong");root.getElementById("hapIn").value="";push();return;}
  if(hapFound.has(key)){status.innerHTML=`<span class="bad">Already found 已经找过了: ${t.join(" ")}</span>`;sfx("pop");root.getElementById("hapIn").value="";return;}
  hapFound.add(key);
  sfx("score");
  root.getElementById("hapIn").value="";
  status.textContent=`Found ${hapFound.size} / ${current.haps.length}`;
  renderHost(); push();
  if(hapFound.size===current.haps.length){
    revealed=true; stopTimer(); sfx("reveal"); renderHost(); push();
  }
}
function submitGyul(){
  if(!current||current.mode!=="hap") return;
  revealed=true; stopTimer();
  if(hapFound.size===current.haps.length) sfx("reveal");
  else sfx("timeup");
  renderHost(); push();
}
function submitSame(){
  if(!current||current.mode!=="same"||revealed) return;
  const nums=(root.getElementById("sameIn").value.match(/\d+/g)||[]).map(Number);
  const status=root.getElementById("sameStatus");
  if(nums.length!==2 || nums[0]===nums[1]){status.innerHTML='<span class="bad">Type two tile numbers, e.g. 3 11</span>';sfx("wrong");return;}
  const a=Math.min(nums[0],nums[1]), b=Math.max(nums[0],nums[1]);
  const N=current.size*current.size;
  if(a<1||b>N){status.innerHTML='<span class="bad">Numbers out of range</span>';sfx("wrong");return;}
  const ok=current.pairs.some(p=>{
    const x=[...p].sort((i,j)=>i-j); return x[0]===a && x[1]===b;
  });
  if(!ok){status.innerHTML=`<span class="bad">Not a matching pair: ${a} & ${b}</span>`;sfx("wrong");root.getElementById("sameIn").value="";return;}
  if(sameFound.some(p=>p[0]===a&&p[1]===b)){status.innerHTML='<span class="bad">Already found 已经找过了</span>';sfx("pop");return;}
  sameFound.push([a,b]);
  sfx("score");
  root.getElementById("sameIn").value="";
  status.textContent=`Found ${sameFound.length} / ${current.nPairs}`;
  renderHost(); push();
  if(sameFound.length===current.nPairs){revealed=true;stopTimer();sfx("reveal");renderHost();push();}
}

function renderHost(){
  const stage=root.getElementById("hostStage");
  const ans=root.getElementById("hostAns");
  const meta=root.getElementById("hostMeta");
  root.getElementById("modeLabel").textContent=current?MODETITLE(current.mode):MODETITLE(modeId());
  stage.innerHTML=stageHTML(current,false,false);
  if(current){
    ans.classList.remove("gone");
    ans.innerHTML=hostAnswerHTML(current);
    const bits=[];
    if(current.mode==="hap") bits.push(current.haps.length+" Haps");
    if(current.mode==="sticks") bits.push("Move "+current.moves);
    if(current.level||current.lvl) bits.push("L"+(current.level||current.lvl));
    if(current.mode==="same") bits.push(current.size+"×"+current.size);
    if(current.mode==="number") bits.push("target "+current.target);
    meta.textContent=bits.join("  ·  ");
  }else{
    ans.innerHTML="";
    meta.textContent="";
  }
  specialVisible();
}

    .hapn{font-size:18px}

function openDisplay(){
  const html=`<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8"><title>Brain Teasers 头脑运动会</title>\n    <style>${displayCSS()}</style></head>\n    <body>\n      <div class="bar"><span id="title">🧠 头脑运动会</span><span id="sc"></span><span id="t">⏱</span></div>\n      <div id="rulebox" class="rule"></div>\n      <div id="stage"></div>\n      <footer class="bar"><span class="hint">Drag this window to the monitor and press F11 (Windows) or Ctrl+Cmd+F (Mac) for full screen</span></footer>\n    </body></html>`;
  disp=Party.mount('bg', html);
  if(!disp){alert("Please allow pop-ups so the big screen can open. 请允许弹出窗口。");return;}
  setTimeout(()=>{push();tick();},80);
}
function scoresText(){
  return "Team A: "+root.getElementById("sa").textContent+"   ·   Team B: "+root.getElementById("sb").textContent;
}
function push(){
  if(!disp||disp.closed)return;
  const D=disp.document;
  const title=D.getElementById("title");
  const stage=D.getElementById("stage");
  const rule=D.getElementById("rulebox");
  const sc=D.getElementById("sc");
  if(!stage)return;
  const mid=current?current.mode:modeId();
  if(title) title.textContent="🧠 "+MODETITLE(mid);
  if(rule) rule.textContent=RULES[mid]||"";
  if(sc) sc.textContent=scoresText();
  stage.innerHTML=stageHTML(current,true,revealed);
}

function nextPuzzle(){
  current=pickNext();
  revealed=false; hapFound=new Set(); sameFound=[];
  const peek=root.getElementById("hostAns");
  peek.classList.add("hidden");
  renderHost();
  startTimer();
  sfx("new");
  push();
}
function reveal(){
  if(!current)return;
  revealed=true; stopTimer();
  sfx("reveal");
  root.getElementById("hostAns").classList.remove("hidden");
  renderHost(); push();
}

function startTimer(){stopTimer();tleft=+root.getElementById("secs").value;tick();
 tint=setInterval(()=>{tleft--;tick();if(tleft>0&&tleft<=10)sfx("tick");
  if(tleft<=0){stopTimer();if(!revealed){/* do not auto-reveal answers, just flag time */ root.getElementById("timer").textContent="⏰ 0"; if(disp&&!disp.closed){const t=disp.document.getElementById("t"); if(t)t.textContent="⏰ 0";}} sfx("timeup");}},1000);}
function stopTimer(){if(tint)clearInterval(tint);tint=null;}
function tick(){root.getElementById("timer").textContent="⏱ "+tleft; if(disp&&!disp.closed){const t=disp.document.getElementById("t"); if(t)t.textContent="⏱ "+tleft;}}

root.getElementById("openDisplay").onclick=openDisplay;
root.getElementById("next").onclick=nextPuzzle;
root.getElementById("reveal").onclick=reveal;
root.getElementById("peek").onclick=()=>root.getElementById("hostAns").classList.toggle("hidden");
['a','b'].forEach(t=>root.querySelector('button[data-t="'+t+'"]').onclick=()=>Party.addScore(t));
root.getElementById("mode").onchange=()=>{current=null;revealed=false;mixDeck=null;renderHost();push();};
root.getElementById("lvl").onchange=()=>{/* keep current puzzle; new Next uses new level */};

buildStaticPools();
ensureGenerated();
renderHost();

window.__bg={
  show:(mode,level,index)=>{
    root.getElementById("mode").value=mode;
    if(level) root.getElementById("lvl").value=String(level);
    const p=poolFor(mode, String(level||"1"));
    current=p[index||0]||p[0]||null;
    revealed=false; hapFound=new Set(); sameFound=[];
    renderHost(); push(); return current;
  },
  next:nextPuzzle, reveal,
  openDisplay, currentOf:()=>current, pools:()=>POOLS,
  submitHap, submitGyul, submitSame,
  genHapBoard, genNumberPuzzle, genSamePicture, allHaps, isHap, safeEval
};
root.getElementById('homeBtn').onclick=()=>Party.goHome();
Party.bindControls(root);
Party.register('bg', {enter(){openDisplay();}, leave(){stopTimer();}, root, push});

})();

Party.init();
